<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07090f;
    --bg2: #0d1117;
    --bg3: #141923;
    --card: #111827;
    --card2: #1a2236;
    --border: #1f2d47;
    --border2: #263652;
    --accent: #3b82f6;
    --accent2: #6366f1;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --orange: #f97316;
    --pink: #ec4899;
    --cyan: #06b6d4;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --glow: 0 0 24px rgba(59,130,246,0.18);
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1, h2, h3, h4, h5 { font-family: 'Space Grotesk', sans-serif; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* Layout */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; width: 100%; }
  .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }

  /* Header bar */
  .topbar {
    background: rgba(13,17,23,0.95);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .topbar-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase; }
  .topbar-step { font-size: 12px; color: var(--text3); background: var(--card); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); }

  /* Progress dots */
  .step-dots { display: flex; gap: 6px; align-items: center; }
  .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); transition: all 0.3s; }
  .step-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .step-dot.done { background: var(--green); }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s;
  }
  .card:hover { border-color: var(--border2); box-shadow: var(--shadow); }
  .card-sm { padding: 16px; border-radius: 12px; }
  .card-accent { border-color: var(--accent); box-shadow: 0 0 20px rgba(59,130,246,0.1); }
  .card-green { border-color: var(--green); box-shadow: 0 0 20px rgba(16,185,129,0.1); }
  .card-red { border-color: var(--red); box-shadow: 0 0 20px rgba(239,68,68,0.1); }
  .card-yellow { border-color: var(--yellow); box-shadow: 0 0 20px rgba(245,158,11,0.1); }

  /* Grid */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

  @media (max-width: 640px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.25s;
    text-decoration: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 20px rgba(59,130,246,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(59,130,246,0.5); }
  .btn-secondary {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border2);
  }
  .btn-secondary:hover { background: var(--border); }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--card); color: var(--text); }
  .btn-danger { background: linear-gradient(135deg,#991b1b,#ef4444); color:#fff; }
  .btn-success { background: linear-gradient(135deg,#065f46,#10b981); color:#fff; }
  .btn-lg { padding: 16px 36px; font-size: 16px; border-radius: 14px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  /* Selectable cards */
  .selectable {
    cursor: pointer;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    background: var(--card);
    transition: all 0.25s;
    position: relative;
  }
  .selectable:hover { border-color: var(--accent); background: var(--card2); transform: translateY(-2px); }
  .selectable.selected { border-color: var(--accent); background: rgba(59,130,246,0.08); box-shadow: 0 0 16px rgba(59,130,246,0.2); }
  .selectable.disabled { opacity: 0.45; cursor: not-allowed; }
  .selectable.disabled:hover { transform: none; border-color: var(--border); }

  /* Check badge */
  .check-badge {
    position: absolute;
    top: 10px; right: 10px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #fff;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s;
  }
  .selected .check-badge { opacity: 1; transform: scale(1); }

  /* Progress bars */
  .progress-wrap { margin-bottom: 14px; }
  .progress-label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; color: var(--text2); }
  .progress-label strong { color: var(--text); font-family: 'Space Grotesk', sans-serif; }
  .progress-bar-bg { height: 8px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 1.2s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: 0; top: 0;
    width: 6px; height: 100%;
    background: rgba(255,255,255,0.4);
    border-radius: 999px;
  }

  /* Tags */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .tag-red { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
  .tag-yellow { background: rgba(245,158,11,0.15); color: #fde68a; border: 1px solid rgba(245,158,11,0.3); }
  .tag-green { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
  .tag-blue { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
  .tag-purple { background: rgba(99,102,241,0.15); color: #c4b5fd; border: 1px solid rgba(99,102,241,0.3); }
  .tag-orange { background: rgba(249,115,22,0.15); color: #fdba74; border: 1px solid rgba(249,115,22,0.3); }

  /* Stat box */
  .stat-box { text-align: center; padding: 20px 16px; }
  .stat-num { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-top: 6px; }

  /* Alert */
  .alert {
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 13px;
    line-height: 1.6;
    border-left: 4px solid;
  }
  .alert-info { background: rgba(59,130,246,0.08); border-color: var(--accent); color: #93c5fd; }
  .alert-warn { background: rgba(245,158,11,0.08); border-color: var(--yellow); color: #fde68a; }
  .alert-danger { background: rgba(239,68,68,0.08); border-color: var(--red); color: #fca5a5; }
  .alert-success { background: rgba(16,185,129,0.08); border-color: var(--green); color: #6ee7b7; }

  /* Section headers */
  .section-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
  .section-title { font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 10px; }
  .section-sub { font-size: 14px; color: var(--text2); line-height: 1.65; }

  /* Divider */
  .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* Score ring */
  .score-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .score-ring { position: relative; width: 100px; height: 100px; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring-value { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; }

  /* Fade in */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.5s ease both; }
  .fade-up-1 { animation-delay: 0.05s; }
  .fade-up-2 { animation-delay: 0.12s; }
  .fade-up-3 { animation-delay: 0.19s; }
  .fade-up-4 { animation-delay: 0.26s; }
  .fade-up-5 { animation-delay: 0.33s; }
  .fade-up-6 { animation-delay: 0.40s; }

  /* Welcome */
  .welcome-hero { text-align: center; max-width: 640px; }
  .welcome-logo { font-size: 48px; margin-bottom: 24px; }
  .welcome-title { font-size: clamp(28px, 6vw, 52px); font-weight: 700; line-height: 1.1; margin-bottom: 16px; background: linear-gradient(135deg, #fff 0%, #93c5fd 50%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .welcome-sub { font-size: 16px; color: var(--text2); line-height: 1.7; margin-bottom: 36px; }
  .welcome-pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 36px; }
  .welcome-pill { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 12px; color: var(--text2); }

  /* Crisis card special */
  .crisis-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
  .crisis-icon { font-size: 40px; flex-shrink: 0; }
  .crisis-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  /* War room action */
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .action-grid { grid-template-columns: 1fr; } }

  /* Negotiation */
  .neg-track { display: flex; gap: 6px; margin-bottom: 20px; }
  .neg-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background 0.4s; }
  .neg-dot.done { background: var(--green); }
  .neg-dot.current { background: var(--accent); }
  .choice-list { display: flex; flex-direction: column; gap: 10px; }

  /* CEO quiz */
  .quiz-choice { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); transition: all 0.2s; }
  .quiz-choice:hover { border-color: var(--border2); background: var(--card2); }
  .quiz-choice.correct { border-color: var(--green); background: rgba(16,185,129,0.1); }
  .quiz-choice.wrong { border-color: var(--red); background: rgba(239,68,68,0.1); }
  .quiz-choice.reveal-correct { border-color: var(--green); background: rgba(16,185,129,0.06); }
  .quiz-index { width: 26px; height: 26px; border-radius: 6px; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text3); flex-shrink: 0; font-family: 'Space Grotesk',sans-serif; }

  /* AI investments */
  .ai-card { border: 2px solid var(--border); border-radius: 14px; padding: 20px; cursor: pointer; background: var(--card); transition: all 0.25s; position: relative; overflow: hidden; }
  .ai-card::before { content:''; position:absolute; top:0;left:0;right:0;height:3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity:0; transition:opacity 0.3s; }
  .ai-card:hover { border-color: var(--accent); }
  .ai-card.selected { border-color: var(--accent); background: rgba(59,130,246,0.06); }
  .ai-card.selected::before { opacity:1; }

  /* Dashboard */
  .dashboard-score { display: flex; flex-direction: column; align-items: center; padding: 32px; background: linear-gradient(135deg, var(--card), var(--card2)); border: 1px solid var(--border2); border-radius: 20px; }
  .dashboard-big { font-family: 'Space Grotesk',sans-serif; font-size: 80px; font-weight: 700; line-height: 1; background: linear-gradient(135deg, #fff, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .feedback-block { background: var(--card2); border: 1px solid var(--border2); border-radius: 14px; padding: 20px; }
  .feedback-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text3); margin-bottom: 6px; font-weight: 600; }
  .feedback-text { font-size: 14px; color: var(--text); line-height: 1.6; }

  /* Tooltip-like why box */
  .why-box { background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.2); border-radius: 10px; padding: 12px 16px; margin-top: 12px; font-size: 12px; color: #93c5fd; line-height: 1.6; }
  .why-box strong { display: block; margin-bottom: 2px; color: #60a5fa; font-family: 'Space Grotesk',sans-serif; }

  /* Consequence row */
  .consequence-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .consequence-row:last-child { border: none; }
  .consequence-delta { font-family: 'Space Grotesk',sans-serif; font-weight: 700; font-size: 13px; min-width: 52px; text-align: right; }
  .delta-up { color: var(--green); }
  .delta-down { color: var(--red); }
  .delta-neutral { color: var(--text3); }

  /* Negotiation trust meter */
  .trust-bar { display: flex; gap: 4px; }
  .trust-seg { flex: 1; height: 6px; border-radius: 3px; background: var(--border); transition: background 0.4s; }

  /* Glowing pulse for urgency */
  @keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
  .pulse-red { animation: pulse-red 2s infinite; }

  /* Smooth transition overlay */
  @keyframes flash { 0% { opacity:0.6; } 100% { opacity:0; } }
  .flash-overlay { position: fixed; inset: 0; background: #fff; pointer-events: none; animation: flash 0.35s ease forwards; z-index: 999; }

  .mt-4 { margin-top: 4px; }
  .mt-8 { margin-top: 8px; }
  .mt-12 { margin-top: 12px; }
  .mt-16 { margin-top: 16px; }
  .mt-24 { margin-top: 24px; }
  .mt-32 { margin-top: 32px; }
  .mb-4 { margin-bottom: 4px; }
  .mb-8 { margin-bottom: 8px; }
  .mb-12 { margin-bottom: 12px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-24 { margin-bottom: 24px; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .items-start { align-items: flex-start; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }
  .gap-16 { gap: 16px; }
  .gap-24 { gap: 24px; }
  .text-center { text-align: center; }
  .w-full { width: 100%; }
  .fs-12 { font-size: 12px; }
  .fs-13 { font-size: 13px; }
  .fs-14 { font-size: 14px; }
  .fs-18 { font-size: 18px; }
  .fs-20 { font-size: 20px; }
  .fw-600 { font-weight: 600; }
  .fw-700 { font-weight: 700; }
  .color-text2 { color: var(--text2); }
  .color-text3 { color: var(--text3); }
  .color-accent { color: var(--accent); }
  .color-green { color: var(--green); }
  .color-red { color: var(--red); }
  .color-yellow { color: var(--yellow); }
  .lh-16 { line-height: 1.6; }
  .font-sg { font-family: 'Space Grotesk', sans-serif; }
</style>
</head>

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, min=0, max=100) { return Math.max(min, Math.min(max, v)); }

function generateGame() {
  const company = { ...rand(COMPANIES) };
  const crisis = { ...rand(CRISES) };
  const country = rand(company.countries);
  const material = rand(MATERIALS);
  crisis.description = crisis.description.replace("{country}", country).replace("{material}", material);
  crisis.affectedCountry = country;

  // Randomise starting metrics
  const base = {
    cost: randInt(52, 72),
    inventory: randInt(55, 78),
    profit: randInt(48, 68),
    delivery: randInt(60, 80),
    satisfaction: randInt(62, 82),
  };
  // Apply crisis hits
  const after = {
    cost: clamp(base.cost + crisis.costHit + randInt(-5,5)),
    inventory: clamp(base.inventory + crisis.inventoryHit + randInt(-5,5)),
    profit: clamp(base.profit + crisis.profitHit + randInt(-5,5)),
    delivery: clamp(base.delivery + crisis.deliveryHit + randInt(-5,5)),
    satisfaction: clamp(base.satisfaction + crisis.satHit + randInt(-5,5)),
  };

  // Shuffle actions and pick 6
  const shuffled = [...WAR_ROOM_ACTIONS].sort(()=>Math.random()-0.5).slice(0,6);
  return { company, crisis, baseMetrics: base, crisisMetrics: after, warRoomActions: shuffled };
}

function ProgressBar({ label, value, color="#3b82f6", prev }) {
  const [display, setDisplay] = useState(prev !== undefined ? prev : value);
  useEffect(()=>{ const t = setTimeout(()=>setDisplay(value),200); return()=>clearTimeout(t); },[value]);
  const delta = prev !== undefined ? value - prev : 0;
  return (
    <div className="progress-wrap">
      <div className="progress-label">
        <strong>{label}</strong>
        <span>{display}%{delta!==0&&<span className={delta>0?"delta-up color-green":"delta-down color-red"}> {delta>0?"+":""}{delta}</span>}</span>
      </div>
      <div className="progress-bar-bg">
        <div className="progress-bar-fill" style={{ width:`${display}%`, background:`linear-gradient(90deg,${color}88,${color})` }}/>
      </div>
    </div>
  );
}

function ScoreRing({ value, color="#3b82f6", size=100, label }) {
  const r = 40; const circ = 2*Math.PI*r;
  const offset = circ - (value/100)*circ;
  return (
    <div className="score-ring-wrap">
      <div className="score-ring" style={{width:size,height:size}}>
        <svg width={size} height={size} viewBox="0 0 100 100">
          <circle cx="50" cy="50" r={r} fill="none" stroke="#1f2d47" strokeWidth="10"/>
          <circle cx="50" cy="50" r={r} fill="none" stroke={color} strokeWidth="10" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{transition:"stroke-dashoffset 1.2s cubic-bezier(0.34,1.56,0.64,1)"}}/>
        </svg>
        <div className="score-ring-value" style={{color}}>{value}</div>
      </div>
      {label && <div className="fs-11 color-text3" style={{textAlign:"center",fontSize:"10px",textTransform:"uppercase",letterSpacing:"0.08em"}}>{label}</div>}
    </div>
  );
}

function WarRoomScreen({ actions, crisisMetrics, onDone }) {
  const [selected, setSelected] = useState([]);
  const [confirmed, setConfirmed] = useState(false);
  const [finalMetrics, setFinalMetrics] = useState(null);

  const toggleAction = (id) => {
    if (confirmed) return;
    setSelected(prev => {
      if (prev.includes(id)) return prev.filter(x=>x!==id);
      if (prev.length >= 3) return prev;
      return [...prev, id];
    });
  };

  const confirm = () => {
    const effects = selected.map(id=>actions.find(a=>a.id===id).effects);
    const combined = effects.reduce((acc,e)=>({
      cost: acc.cost + e.cost,
      inventory: acc.inventory + e.inventory,
      profit: acc.profit + e.profit,
      delivery: acc.delivery + e.delivery,
      satisfaction: acc.satisfaction + e.satisfaction,
    }),{cost:0,inventory:0,profit:0,delivery:0,satisfaction:0});
    setFinalMetrics({
      cost: clamp(crisisMetrics.cost + combined.cost + randInt(-3,3)),
      inventory: clamp(crisisMetrics.inventory + combined.inventory + randInt(-3,3)),
      profit: clamp(crisisMetrics.profit + combined.profit + randInt(-3,3)),

function NegotiationScreen({ onDone }) {

    setLead(v => clamp(v + choice.lead));

function FinalDashboard({ game, warRoomMetrics, warRoomActions, negScore, ceoScore, aiInvestments, onReplay }) {
  const { company, crisis, crisisMetrics } = game;

  // Calculate sub-scores
  const leadershipScore = ceoScore;
  const negotiationScore = negScore;
  const resilienceScore = Math.round((warRoomMetrics.inventory * 0.5 + warRoomMetrics.delivery * 0.5) * 0.9);
  const costControlScore = Math.round(warRoomMetrics.cost * 0.9 + warRoomMetrics.profit * 0.1);
  const riskScore = Math.round(((aiInvestments.find(a=>a.id==="ai3")?20:0) + (aiInvestments.find(a=>a.id==="ai1")?15:0) + 50) * (negScore/100));
  const satScore = warRoomMetrics.satisfaction;

  const overall = Math.round(
    leadershipScore * 0.20 +
    negotiationScore * 0.20 +
    clamp(resilienceScore) * 0.15 +
    clamp(costControlScore) * 0.15 +
    clamp(riskScore) * 0.15 +
    satScore * 0.15
  );

  const grade = overall>=85?"A":overall>=70?"B":overall>=55?"C":overall>=40?"D":"F";
  const gradeColor = overall>=85?"var(--green)":overall>=70?"var(--accent)":overall>=55?"var(--yellow)":overall>=40?"var(--orange)":"var(--red)";

  // Best & worst decisions
  const bestAction = warRoomActions.reduce((best,a)=>{
    const sum = Object.values(a.effects).reduce((s,v)=>s+(v||0),0);
    const bSum = Object.values(best.effects).reduce((s,v)=>s+(v||0),0);
    return sum>bSum?a:best;
  }, warRoomActions[0]);

  const worstAction = warRoomActions.reduce((worst,a)=>{
    const sum = Object.values(a.effects).reduce((s,v)=>s+(v||0),0);
    const wSum = Object.values(worst.effects).reduce((s,v)=>s+(v||0),0);
    return sum<wSum?a:worst;
  }, warRoomActions[0]);

  const feedback = overall>=80
    ? "Outstanding crisis management. You balanced tactical response with strategic relationship-building. Your supplier negotiation built genuine partnership and your executive decisions show boardroom maturity."
    : overall>=60
    ? "Solid performance under pressure. You made sensible decisions but missed some key opportunities to protect long-term relationships and profit margins. A few more insights would push you to the top tier."
    : "This crisis exposed some gaps in your supply chain thinking. You took actions that addressed visible symptoms but the underlying resilience issues remain. Review the lessons below before your next simulation.";

  const lessons = [
    "Supply chain resilience is built before the crisis, not during it.",
    "Transparency with customers during disruptions reduces churn by 30–40%.",
    "Single-source dependency is the #1 cause of catastrophic supply failures.",
    "AI investments in risk monitoring create a 90-day early warning advantage.",
    "The best negotiators listen more than they talk in the first two rounds.",
  ];

  const subScores = [
    { label:"Leadership", value: clamp(leadershipScore), color:"#3b82f6" },
    { label:"Negotiation", value: clamp(negotiationScore), color:"#10b981" },
    { label:"Resilience", value: clamp(resilienceScore), color:"#6366f1" },
    { label:"Cost Control", value: clamp(costControlScore), color:"#f59e0b" },
    { label:"Risk Mgmt", value: clamp(riskScore), color:"#ef4444" },
    { label:"Customer Sat.", value: clamp(satScore), color:"#ec4899" },
  ];

  return (
    <div style={{padding:"40px 0"}}>
      <div className="container">
        <div className="fade-up mb-24 text-center">
          <div className="section-eyebrow">📊 Final Dashboard</div>
          <h2 className="section-title">Crisis Performance Report</h2>
          <p className="section-sub">{company.name} · {crisis.type} Crisis</p>
        </div>

        {/* Overall Score */}
        <div className="dashboard-score mb-24 fade-up fade-up-2">
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
            <div className="dashboard-big" style={{background:`linear-gradient(135deg,${gradeColor},#fff)`,-webkitBackgroundClip:"text",-webkitTextFillColor:"transparent",backgroundClip:"text"}}>{overall}</div>
            <div className="fs-14 color-text2">Overall Crisis Score</div>
            <div style={{fontSize:48,fontFamily:"Space Grotesk",fontWeight:700,color:gradeColor,lineHeight:1}}>Grade {grade}</div>
            <div className="fs-13 color-text2 mt-4">{feedback.split('.')[0]}.</div>
          </div>
        </div>

        {/* Sub scores */}
        <div style={{display:"flex",flexWrap:"wrap",gap:16,justifyContent:"center",marginBottom:32}} className="fade-up fade-up-3">
          {subScores.map(s=>(
            <ScoreRing key={s.label} value={s.value} color={s.color} label={s.label}/>
          ))}
        </div>

        {/* Metrics */}
        <div className="grid-2 mb-24 fade-up fade-up-3">
          <div className="card">
            <div className="fw-600 mb-12">📉 Pre-Crisis Baseline</div>
            <MetricsDashboard metrics={game.baseMetrics}/>
          </div>
          <div className="card">
            <div className="fw-600 mb-12">📈 Final State After Response</div>
            <MetricsDashboard metrics={warRoomMetrics} prevMetrics={game.baseMetrics}/>
          </div>
        </div>

        {/* Feedback blocks */}
        <div className="grid-2 mb-24 fade-up fade-up-4">
          <div className="feedback-block">
            <div className="feedback-label">🏆 Best Decision</div>
            <div className="feedback-text fw-600 mb-4">{bestAction.emoji} {bestAction.title}</div>
            <div className="feedback-text fs-12 color-text2">{bestAction.impact}</div>
          </div>
          <div className="feedback-block">
            <div className="feedback-label">⚠️ Costliest Mistake</div>
            <div className="feedback-text fw-600 mb-4">{worstAction.emoji} {worstAction.title}</div>
            <div className="feedback-text fs-12 color-text2">This action had the lowest net impact on your recovery metrics.</div>
          </div>
        </div>

        <div className="feedback-block mb-24 fade-up fade-up-4">
          <div className="feedback-label">💼 Full Assessment</div>
          <div className="feedback-text lh-16">{feedback}</div>
        </div>

        {/* AI Investments */}
        <div className="card mb-24 fade-up fade-up-5">
          <div className="fw-600 mb-12">🤖 Your AI Investment Strategy</div>
          <div className="grid-2">
            {aiInvestments.map(ai=>(
              <div key={ai.id} className="flex items-start gap-12">
                <span style={{fontSize:24}}>{ai.emoji}</span>
                <div>
                  <div className="fw-600 fs-13">{ai.name}</div>
                  <div className="fs-11 color-text2 mt-4">{ai.impacts[0]}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* Expert Recommendation */}
        <div className="alert alert-info mb-24 fade-up fade-up-5">
          <strong>🎯 Expert Recommendation</strong><br/>
          Based on your performance, focus next on: {
            leadershipScore < 60 ? "supply chain risk frameworks and executive decision-making under uncertainty." :
            negotiationScore < 55 ? "supplier relationship management and principled negotiation tactics." :
            resilienceScore < 55 ? "building dual-sourcing programs and improving safety stock strategy." :
            "sustaining your strengths while measuring real-world outcomes against these simulated decisions."
          }
        </div>

        {/* Lessons */}
        <div className="card mb-32 fade-up fade-up-6">
          <div className="fw-600 mb-12">📚 Key Lessons from This Crisis</div>
          {lessons.map((l,i)=>(
            <div key={i} className="flex items-start gap-12 mb-10">
              <span className="tag tag-blue" style={{flexShrink:0,fontSize:10}}>{i+1}</span>
              <span className="fs-13 color-text2 lh-16">{l}</span>
            </div>
          ))}
        </div>

        <div className="text-center fade-up fade-up-6">
          <button className="btn btn-primary btn-lg" onClick={onReplay}>
            🔄 Run a New Simulation
          </button>
          <p className="mt-12 fs-12 color-text3">New company · new crisis · new outcomes every time</p>
        </div>
      </div>
    </div>
  );
}

// ─── ROOT APP ──────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("welcome");
  const [game, setGame] = useState(null);
  const [warRoomMetrics, setWarRoomMetrics] = useState(null);
  const [warRoomActions, setWarRoomActions] = useState([]);
  const [negScore, setNegScore] = useState(0);
  const [ceoScore, setCeoScore] = useState(0);
  const [aiInvestments, setAiInvestments] = useState([]);

  const STEPS = { welcome:-1, company:0, crisis:1, warroom:2, negotiation:3, ceo:4, ai:5, dashboard:6 };
  const step = STEPS[screen] ?? -1;

  const start = () => {
    setGame(generateGame());
    setScreen("company");
  };

  const replay = () => {
    setWarRoomMetrics(null);
    setWarRoomActions([]);
    setNegScore(0);
    setCeoScore(0);
    setAiInvestments([]);
    start();
  };

  return (
    <div className="app">
      {screen !== "welcome" && <TopBar step={step} total={7}/>}
      {screen === "welcome" && <WelcomeScreen onStart={start}/>}
      {screen === "company" && game && (
        <CompanyScreen company={game.company} onNext={()=>setScreen("crisis")}/>
      )}
      {screen === "crisis" && game && (
        <CrisisScreen crisis={game.crisis} company={game.company} onNext={()=>setScreen("warroom")}/>
      )}
      {screen === "warroom" && game && (
        <WarRoomScreen
          actions={game.warRoomActions}
          crisisMetrics={game.crisisMetrics}
          onDone={(metrics, actions)=>{ setWarRoomMetrics(metrics); setWarRoomActions(actions); setScreen("negotiation"); }}
        />
      )}
      {screen === "negotiation" && (
        <NegotiationScreen onDone={(s)=>{ setNegScore(s); setScreen("ceo"); }}/>
      )}
      {screen === "ceo" && (
        <CEOBoardroomScreen onDone={(s)=>{ setCeoScore(s); setScreen("ai"); }}/>
      )}
      {screen === "ai" && (
        <AIStrategyScreen onDone={(investments)=>{ setAiInvestments(investments); setScreen("dashboard"); }}/>
      )}
      {screen === "dashboard" && game && warRoomMetrics && (
        <FinalDashboard
          game={game}
          warRoomMetrics={warRoomMetrics}
          warRoomActions={warRoomActions}
          negScore={negScore}
          ceoScore={ceoScore}
          aiInvestments={aiInvestments}
          onReplay={replay}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
