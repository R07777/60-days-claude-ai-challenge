<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass — Tech Company</title>
<style>
  :root{
    --bg-0:#0a0e17;
    --bg-1:#0f1524;
    --bg-2:#141b2d;
    --glass:rgba(255,255,255,0.045);
    --glass-b:rgba(255,255,255,0.09);
    --ink:#eef1f8;
    --ink-dim:#9aa4bd;
    --ink-faint:#5d6584;
    --gold:#f5c451;
    --good:#3ecf8e;
    --bad:#ef6a6a;
    --fe:#5b8def;
    --be:#8b6ff0;
    --qa:#3ecf8e;
    --pm:#f5a742;
    --ux:#ef6ba8;
    --cs:#38bfc4;
    --em:#ef6a6a;
    --devops:#6c7bf0;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 700px at 15% -10%, #182240 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 10%, #1c1436 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
    color:var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- header / compass ---------- */
  header.app-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-title{font-size:26px;font-weight:800;letter-spacing:0.5px;margin:0;}
  .brand-sub{margin:2px 0 0;color:var(--ink-dim);font-size:13px;letter-spacing:0.3px;}
  .compass{width:56px;height:56px;flex-shrink:0;position:relative;}
  .compass svg{width:100%;height:100%;display:block;}
  .compass-needle{transform-origin:50px 50px;transition:transform 1.1s cubic-bezier(.3,1.4,.4,1);}

  .progress-track{display:flex;gap:8px;margin:6px 0 26px;}
  .progress-seg{flex:1;height:6px;border-radius:6px;background:var(--glass);overflow:hidden;position:relative;}
  .progress-seg i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),#ffe2a0);transition:width .6s ease;}

  /* ---------- generic panels ---------- */
  .panel{
    background:var(--glass);
    border:1px solid var(--glass-b);
    border-radius:var(--radius);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:26px;
    box-shadow:0 20px 50px -25px rgba(0,0,0,0.6);
  }
  .center{text-align:center;}
  h2.stage-title{font-size:14px;text-transform:uppercase;letter-spacing:2.2px;color:var(--gold);margin:0 0 6px;font-weight:700;}
  h1.big{font-size:30px;margin:0 0 10px;font-weight:800;}
  p.lede{color:var(--ink-dim);font-size:15px;line-height:1.55;margin:0 0 20px;}

  .btn{
    appearance:none;border:none;cursor:pointer;
    background:linear-gradient(180deg,var(--gold),#e0a832);
    color:#1a1305;font-weight:700;font-size:14.5px;
    padding:13px 26px;border-radius:12px;letter-spacing:0.2px;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    box-shadow:0 10px 24px -10px rgba(245,196,81,0.5);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(245,196,81,0.65);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.ghost{
    background:transparent;color:var(--ink);border:1px solid var(--glass-b);
    box-shadow:none;font-weight:600;
  }
  .btn.ghost:hover{background:var(--glass);transform:translateY(-2px);}
  .btn-row{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

  /* ---------- welcome ---------- */
  .role-strip{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 4px;}
  .role-chip-mini{
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
    background:var(--glass);border:1px solid var(--glass-b);font-size:12.5px;color:var(--ink-dim);
  }
  .role-chip-mini .dot{width:8px;height:8px;border-radius:50%;}

  /* ---------- ticket / task card ---------- */
  .ticket{
    position:relative;
    background:linear-gradient(155deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border:1px solid var(--glass-b);
    border-left:5px solid var(--gold);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:22px;
  }
  .ticket-tag{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:8px;}
  .ticket-text{font-size:17px;line-height:1.5;font-weight:600;}
  .ticket-id{position:absolute;top:14px;right:18px;font-size:11px;color:var(--ink-faint);font-family:ui-monospace,Menlo,Consolas,monospace;}

  /* ---------- slots ---------- */
  .slot-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:18px 0 6px;}
  .slot{
    width:150px;min-height:96px;border-radius:14px;
    border:2px dashed rgba(255,255,255,0.16);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:10px;text-align:center;color:var(--ink-faint);font-size:12px;
    transition:border-color .2s ease, background .2s ease, transform .15s ease;
    position:relative;
  }
  .slot.owner-slot{width:190px;min-height:110px;border-color:rgba(245,196,81,0.4);}
  .slot .slot-label{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-faint);position:absolute;top:8px;left:0;right:0;}
  .slot.filled{border-style:solid;background:rgba(255,255,255,0.05);}
  .slot.drag-over{border-color:var(--gold);background:rgba(245,196,81,0.08);transform:scale(1.03);}
  .slot .placed-card{margin-top:8px;}
  .slot .step-index{position:absolute;bottom:6px;right:8px;font-size:10px;color:var(--ink-faint);font-family:ui-monospace,monospace;}
  .arrow-between{align-self:center;color:var(--ink-faint);font-size:20px;margin:0 -2px;}

  /* ---------- role cards ---------- */
  .role-pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0;}
  .role-card{
    width:118px;min-height:96px;border-radius:14px;padding:12px 8px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--glass-b);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    cursor:grab;user-select:none;text-align:center;
    transition:transform .18s cubic-bezier(.2,1.4,.4,1), box-shadow .18s ease, border-color .18s ease, opacity .18s ease;
    font-size:12.5px;font-weight:600;color:var(--ink);
    position:relative;
  }
  .role-card .icon{font-size:24px;line-height:1;}
  .role-card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 22px -12px rgba(0,0,0,0.6);}
  .role-card.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,196,81,0.5);}
  .role-card.used{opacity:0.28;cursor:not-allowed;pointer-events:none;}
  .role-card.dragging{opacity:0.4;}
  .role-card .bar{position:absolute;left:10px;right:10px;bottom:8px;height:3px;border-radius:3px;}
  .role-card.chip-toggle{cursor:pointer;}
  .role-card.chip-toggle.picked{border-color:var(--gold);background:rgba(245,196,81,0.09);}
  .role-card.chip-toggle.primary-picked{border-color:var(--gold);background:rgba(245,196,81,0.16);box-shadow:0 0 0 2px rgba(245,196,81,0.55);}

  .hint-row{text-align:center;color:var(--ink-faint);font-size:12.5px;margin-top:2px;}

  /* ---------- reveal ---------- */
  .reveal{
    margin-top:22px;padding:20px;border-radius:14px;
    background:rgba(62,207,142,0.07);border:1px solid rgba(62,207,142,0.28);
    animation:fadeUp .45s ease both;
  }
  .reveal.miss{background:rgba(239,106,106,0.07);border-color:rgba(239,106,106,0.28);}
  .reveal h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;}
  .reveal p{margin:6px 0;color:var(--ink-dim);font-size:14px;line-height:1.6;}
  .reveal strong{color:var(--ink);}
  .assist-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .assist-tag{padding:5px 11px;border-radius:999px;font-size:12px;background:var(--glass);border:1px solid var(--glass-b);}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{0%{transform:scale(0.6);opacity:0;}70%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);}}
  .pop{animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both;}

  /* ---------- stage2 animation lane ---------- */
  .flow-lane{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:26px 0 8px;min-height:90px;position:relative;}
  .flow-node{
    width:78px;height:78px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.05);border:1px solid var(--glass-b);font-size:11px;gap:4px;opacity:0;transform:translateY(14px);
  }
  .flow-node.show{animation:flowIn .5s ease forwards;}
  @keyframes flowIn{to{opacity:1;transform:translateY(0);}}
  .flow-arrow{opacity:0;color:var(--gold);font-size:18px;}
  .flow-arrow.show{animation:fadeUp .4s ease forwards;}
  .ticket-travel{
    position:absolute;top:-30px;left:0;font-size:20px;
    animation:travel 2.6s linear forwards;
  }
  @keyframes travel{from{left:0;}to{left:calc(100% - 24px);}}

  /* ---------- stage3 grid ---------- */
  .role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0;}
  @media (max-width:560px){.role-grid{grid-template-columns:repeat(2,1fr);}}
  .picker-legend{display:flex;gap:18px;justify-content:center;color:var(--ink-dim);font-size:12.5px;margin-top:4px;flex-wrap:wrap;}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}

  /* ---------- results ---------- */
  .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;align-items:center;}
  @media (max-width:640px){.score-grid{grid-template-columns:1fr;}}
  .bars{display:flex;flex-direction:column;gap:14px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--ink-dim);}
  .bar-track{height:10px;border-radius:6px;background:var(--glass);overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;width:0%;transition:width 1.1s cubic-bezier(.2,1,.3,1);}
  .radar-wrap{display:flex;align-items:center;justify-content:center;}

  .reflect-block{margin-top:26px;display:grid;gap:14px;}
  .reflect-card{
    background:var(--glass);border:1px solid var(--glass-b);border-radius:14px;padding:16px 18px;
    display:flex;gap:12px;align-items:flex-start;
  }
  .reflect-card .emoji{font-size:20px;line-height:1;}
  .reflect-card p{margin:0;font-size:14px;color:var(--ink-dim);line-height:1.55;}
  .reflect-card strong{color:var(--ink);}
  .insight-card{border-color:rgba(245,196,81,0.35);background:rgba(245,196,81,0.06);}

  .confetti-piece{position:fixed;top:-20px;border-radius:2px;pointer-events:none;z-index:50;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0.2;}}

  footer.foot{text-align:center;color:var(--ink-faint);font-size:11.5px;margin-top:50px;letter-spacing:0.3px;}

  ::selection{background:rgba(245,196,81,0.35);}
  .visually-hidden{position:absolute;left:-9999px;}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div class="brand">
      <div class="compass">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
          <circle cx="50" cy="50" r="46" fill="none" stroke="url(#gradRing)" stroke-width="2" stroke-dasharray="289" id="compassArc" stroke-dashoffset="289"/>
          <defs>
            <linearGradient id="gradRing" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f5c451"/>
              <stop offset="100%" stop-color="#ef6ba8"/>
            </linearGradient>
          </defs>
          <text x="50" y="16" text-anchor="middle" font-size="7" fill="#5d6584" font-weight="700">N</text>
          <text x="50" y="90" text-anchor="middle" font-size="7" fill="#5d6584" font-weight="700">S</text>
          <text x="10" y="53" text-anchor="middle" font-size="7" fill="#5d6584" font-weight="700">W</text>
          <text x="90" y="53" text-anchor="middle" font-size="7" fill="#5d6584" font-weight="700">E</text>
          <g class="compass-needle" id="needle">
            <polygon points="50,14 45,50 50,58 55,50" fill="#f5c451"/>
            <polygon points="50,86 45,50 50,42 55,50" fill="#3a4160"/>
          </g>
          <circle cx="50" cy="50" r="4.5" fill="#eef1f8"/>
        </svg>
      </div>
      <div>
        <p class="brand-title">Task Compass</p>
        <p class="brand-sub">Learn how work flows through real organizations.</p>
      </div>
    </div>
  </header>

  <div class="progress-track" id="progressTrack">
    <div class="progress-seg"><i id="seg0"></i></div>
    <div class="progress-seg"><i id="seg1"></i></div>
    <div class="progress-seg"><i id="seg2"></i></div>
  </div>

  <main id="app"></main>

  <footer class="foot">Task Compass · Tech Company Edition · a management simulation, not a quiz</footer>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     DATA
  ========================================================= */
  var ROLES = [
    {id:"fe",  name:"Frontend Developer",  icon:"💻", color:"var(--fe)"},
    {id:"be",  name:"Backend Developer",   icon:"🗄️", color:"var(--be)"},
    {id:"qa",  name:"QA Engineer",         icon:"🔍", color:"var(--qa)"},
    {id:"pm",  name:"Product Manager",     icon:"🧭", color:"var(--pm)"},
    {id:"ux",  name:"UX Designer",         icon:"🎨", color:"var(--ux)"},
    {id:"cs",  name:"Customer Support",    icon:"🎧", color:"var(--cs)"},
    {id:"em",  name:"Engineering Manager", icon:"📐", color:"var(--em)"},
    {id:"do",  name:"DevOps Engineer",     icon:"⚙️", color:"var(--devops)"}
  ];
  function roleById(id){ for (var i=0;i<ROLES.length;i++){ if (ROLES[i].id===id) return ROLES[i]; } return null; }

  var STAGE1_BANK = [
    { id:"t1", text:"Customers report the payment button doesn't respond on iPhones, but it works fine on Android and desktop.",
      owner:"fe", assist:["qa","be","cs"],
      why:"Behavior that only breaks on one platform is usually a client rendering or event-handling issue, which lives in the frontend codebase." },
    { id:"t2", text:"Weekly active users dropped 15% in the week following the last release.",
      owner:"pm", assist:["em","be","ux"],
      why:"A metrics drop tied to a release is a product-health question first — the Product Manager investigates what changed and pulls in the right team once a cause is suspected." },
    { id:"t3", text:"The API returns intermittent 500 errors whenever traffic spikes above normal levels.",
      owner:"be", assist:["do","em","qa"],
      why:"Server errors under load point to application or query logic, which the Backend Developer owns, though infrastructure scaling often plays a supporting role." },
    { id:"t4", text:"A bug appears consistently in production but never shows up in the staging environment.",
      owner:"qa", assist:["do","be","fe"],
      why:"Diagnosing environment-specific discrepancies is core QA territory — they own confirming and isolating the difference before anyone touches code." },
    { id:"t5", text:"Users keep abandoning the new checkout flow at the second step.",
      owner:"ux", assist:["pm","fe","cs"],
      why:"A drop-off at a specific step in a flow is a usability signal, which the UX Designer is best placed to diagnose and redesign." },
    { id:"t6", text:"A long-time customer was charged twice and is furious, threatening to cancel their subscription.",
      owner:"cs", assist:["be","pm","em"],
      why:"The relationship and resolution with an upset customer belongs to Customer Support, even though the billing bug itself needs an engineering fix." },
    { id:"t7", text:"Two engineers on the same team keep missing sprint deadlines for unclear reasons.",
      owner:"em", assist:["pm","be","fe"],
      why:"Recurring delivery problems on a team are a people-and-process issue, which the Engineering Manager owns." },
    { id:"t8", text:"The nightly deployment pipeline has failed three nights in a row, for a different reason each time.",
      owner:"do", assist:["be","em","qa"],
      why:"Pipeline reliability is infrastructure work, squarely owned by DevOps, even when the underlying causes vary." },
    { id:"t9", text:"A security researcher reports that user passwords may be stored without proper encryption.",
      owner:"be", assist:["do","em","qa"],
      why:"Data storage and encryption logic live in the backend, making it the natural owner, with DevOps and management closely involved given the severity." }
  ];

  var STAGE2_BANK = [
    { id:"r1", text:"A user reports a broken image icon on their profile page instead of their photo.",
      steps:["cs","fe","qa"],
      why:"Support logs and reports the visual bug, the Frontend Developer fixes the broken rendering, and QA verifies the fix across browsers before the ticket closes." },
    { id:"r2", text:"Customers are requesting the ability to export their data as a CSV file.",
      steps:["pm","ux","be","qa"],
      why:"The Product Manager scopes and prioritizes the request, UX designs the interaction, Backend builds the export logic, and QA tests it before release." },
    { id:"r3", text:"A critical outage takes the checkout page down during a major sale.",
      steps:["do","be","em","qa","cs"],
      why:"DevOps stabilizes the infrastructure first, Backend fixes the underlying defect, the Engineering Manager coordinates the response, QA confirms stability, and Support communicates the resolution to customers." },
    { id:"r4", text:"Customer Support notices a typo in an error message shown to users.",
      steps:["cs","fe","qa"],
      why:"Support flags the copy issue, the Frontend Developer updates the text in the codebase, and QA confirms it displays correctly before shipping." },
    { id:"r5", text:"The mobile app crashes on startup for users with older phone models.",
      steps:["qa","fe","em","cs"],
      why:"QA reproduces and isolates which devices are affected, the Frontend Developer fixes the crash, the Engineering Manager signs off on the rollout, and Support notifies affected users once it's resolved." }
  ];

  var STAGE3_BANK = [
    { id:"c1", text:"Customer satisfaction scores suddenly drop across the board.",
      primary:"pm", supporting:["ux","cs","em"],
      why:"A broad satisfaction drop is systemic, so the Product Manager coordinates the investigation, UX examines usability regressions, Support surfaces qualitative complaints, and the Engineering Manager ensures a fix gets resourced.",
      flow:"Customer Support → Product Manager ↔ UX Designer & Engineering Manager → back to Product Manager → customers." },
    { id:"c2", text:"Sales increase dramatically after a product goes viral on social media.",
      primary:"do", supporting:["be","em","cs"],
      why:"A sudden traffic surge is first an uptime risk, so DevOps scales infrastructure, Backend ensures the application holds up under load, the Engineering Manager coordinates urgency, and Support manages the wave of new questions.",
      flow:"DevOps ↔ Backend Developer (stabilize) → Engineering Manager (coordinate) → Customer Support (frontline)." },
    { id:"c3", text:"Negative reviews mentioning a \"buggy app\" start appearing online.",
      primary:"em", supporting:["qa","fe","pm"],
      why:"A reputational pattern of bugs needs coordinated triage — the Engineering Manager organizes the response, QA identifies and prioritizes what's real, Frontend fixes client-side issues, and the Product Manager tracks impact and messaging.",
      flow:"Engineering Manager → QA Engineer (triage) → Frontend Developer (fix) → Product Manager (communicate)." },
    { id:"c4", text:"A major feature launch is delayed past its promised deadline.",
      primary:"em", supporting:["pm","be","qa"],
      why:"The Engineering Manager re-plans timeline and resourcing, the Product Manager decides what to communicate and what scope to protect, Backend finishes the core implementation, and QA ensures quality isn't sacrificed for speed.",
      flow:"Engineering Manager ↔ Product Manager (scope & comms) → Backend Developer (build) → QA Engineer (verify) → Engineering Manager (final call)." },
    { id:"c5", text:"A competitor launches a strikingly similar product the same week.",
      primary:"pm", supporting:["ux","em","cs"],
      why:"Competitive response starts with the Product Manager reassessing strategy, UX considers what differentiates the experience, the Engineering Manager evaluates what can realistically ship faster, and Support listens for what customers compare it to.",
      flow:"Product Manager → UX Designer & Engineering Manager (options) → Product Manager (decision) → Customer Support (messaging)." }
  ];

  var INSIGHTS = [
    "Ownership usually means being the first responsible party, not the only person who touches the problem.",
    "Many real workplace problems are solved by teams rather than individuals.",
    "Escalation isn't failure — routing a task to the right person quickly is often the most valuable skill in an organization.",
    "The same task can reasonably route through different teams depending on company size and structure; there is rarely one universal answer.",
    "Clear ownership tends to speed things up, while clear collaboration tends to make the outcome better."
  ];

  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function pick(arr,n){ return shuffle(arr).slice(0,n); }

  /* =========================================================
     STATE
  ========================================================= */
  var state = {
    stage: "intro", // intro | s1 | s2 | s3 | results
    s1Tasks: [], s1Index: 0, s1Results: [],
    s2Tasks: [], s2Index: 0, s2Results: [],
    s3Tasks: [], s3Index: 0, s3Results: [],
    // transient interaction state
    ownerChoice: null,
    assistChoice: [],
    slotFill: [],      // stage2 current fill array
    pickPrimary: null, // stage3
    pickSupport: [],
    selectedForDrag: null,
    revealed: false
  };

  var app = document.getElementById("app");

  /* =========================================================
     PROGRESS + COMPASS
  ========================================================= */
  function overallProgress(){
    var totalDone = state.s1Results.length + state.s2Results.length + state.s3Results.length;
    return totalDone / 9; // 3+3+3
  }
  function updateProgress(){
    var segs = [
      Math.max(0, Math.min(1, state.s1Results.length/3)),
      Math.max(0, Math.min(1, state.s2Results.length/3)),
      Math.max(0, Math.min(1, state.s3Results.length/3))
    ];
    document.getElementById("seg0").style.width = (segs[0]*100)+"%";
    document.getElementById("seg1").style.width = (segs[1]*100)+"%";
    document.getElementById("seg2").style.width = (segs[2]*100)+"%";
    var frac = overallProgress();
    var deg = frac * 270; // 0 -> 270 degrees sweep
    document.getElementById("needle").style.transform = "rotate("+deg+"deg)";
    var circumference = 289;
    document.getElementById("compassArc").setAttribute("stroke-dashoffset", (circumference - circumference*frac));
  }

  /* =========================================================
     SHARED UI HELPERS
  ========================================================= */
  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }

  function roleCardHTML(role, opts){
    opts = opts || {};
    var cls = "role-card";
    if (opts.extraClass) cls += " " + opts.extraClass;
    return '<div class="'+cls+'" data-role="'+role.id+'" draggable="'+(opts.draggable===false?"false":"true")+'" tabindex="0" role="button" aria-label="'+role.name+'">'+
      '<div class="icon">'+role.icon+'</div><div>'+role.name+'</div>'+
      '<div class="bar" style="background:'+role.color+'"></div>'+
    '</div>';
  }

  function makeConfetti(){
    var colors = ["#f5c451","#5b8def","#3ecf8e","#ef6ba8","#8b6ff0","#38bfc4"];
    for (var i=0;i<60;i++){
      (function(i){
        var p = document.createElement("div");
        p.className = "confetti-piece";
        var c = colors[i % colors.length];
        var size = 6 + Math.random()*6;
        p.style.background = c;
        p.style.width = size+"px";
        p.style.height = (size*0.4)+"px";
        p.style.left = (Math.random()*100)+"vw";
        p.style.animationDuration = (2.2+Math.random()*1.6)+"s";
        p.style.animationDelay = (Math.random()*0.4)+"s";
        document.body.appendChild(p);
        setTimeout(function(){ p.remove(); }, 4200);
      })(i);
    }
  }

  /* =========================================================
     INTRO
  ========================================================= */
  function renderIntro(){
    updateProgress();
    app.innerHTML = "";
    var chips = ROLES.map(function(r){
      return '<div class="role-chip-mini"><span class="dot" style="background:'+r.color+'"></span>'+r.icon+' '+r.name+'</div>';
    }).join("");
    var panel = el(
      '<div class="panel center">'+
        '<h2 class="stage-title">Tech Company · Simulation</h2>'+
        '<h1 class="big">Who really owns this work?</h1>'+
        '<p class="lede">You will move through three stages: deciding ownership, routing tasks through a team, and coordinating a full department response. There is no single right answer key — every reveal explains the reasoning, so you leave understanding how the organization actually works, not just what to click.</p>'+
        '<div class="role-strip">'+chips+'</div>'+
        '<div class="btn-row"><button class="btn" id="startBtn">Start the simulation</button></div>'+
      '</div>'
    );
    app.appendChild(panel);
    document.getElementById("startBtn").addEventListener("click", function(){
      state.s1Tasks = pick(STAGE1_BANK, 3);
      state.s2Tasks = pick(STAGE2_BANK, 3);
      state.s3Tasks = pick(STAGE3_BANK, 3);
      state.stage = "s1"; state.s1Index = 0;
      renderStage1();
    });
  }

  /* =========================================================
     STAGE 1 — Who Owns This?
  ========================================================= */
  function renderStage1(){
    updateProgress();
    state.revealed = false;
    state.ownerChoice = null;
    state.assistChoice = [];
    app.innerHTML = "";
    var task = state.s1Tasks[state.s1Index];

    var panel = el(
      '<div class="panel">'+
        '<h2 class="stage-title">Stage 1 · Who Owns This? — Task '+(state.s1Index+1)+' of 3</h2>'+
        '<div class="ticket pop">'+
          '<div class="ticket-tag">Incoming ticket</div>'+
          '<div class="ticket-text">'+task.text+'</div>'+
          '<div class="ticket-id">#TC-'+(1000+state.s1Index)+'</div>'+
        '</div>'+
        '<p class="lede center" style="margin-bottom:8px;">Drag or tap one role into the ownership slot below.</p>'+
        '<div class="slot-row">'+
          '<div class="slot owner-slot" id="ownerSlot"><span class="slot-label">Primary Owner</span></div>'+
        '</div>'+
        '<div class="role-pool" id="rolePool"></div>'+
        '<p class="lede center" id="assistPrompt" style="display:none;margin-top:4px;">Optional: tap any roles that might also assist (choose as many as feel right).</p>'+
        '<div class="role-pool" id="assistPool" style="display:none;"></div>'+
        '<div class="btn-row"><button class="btn" id="submitS1" disabled>Submit</button></div>'+
        '<div id="revealArea"></div>'+
      '</div>'
    );
    app.appendChild(panel);

    var rolePool = document.getElementById("rolePool");
    ROLES.forEach(function(role){
      var card = el(roleCardHTML(role));
      card.addEventListener("dragstart", function(e){
        card.classList.add("dragging");
        e.dataTransfer.setData("text/plain", role.id);
      });
      card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
      card.addEventListener("click", function(){
        if (card.classList.contains("used")) return;
        placeOwner(role.id);
      });
      card.addEventListener("keydown", function(e){
        if ((e.key === "Enter" || e.key === " ") && !card.classList.contains("used")){
          e.preventDefault(); placeOwner(role.id);
        }
      });
      rolePool.appendChild(card);
    });

    var ownerSlot = document.getElementById("ownerSlot");
    ownerSlot.addEventListener("dragover", function(e){ e.preventDefault(); ownerSlot.classList.add("drag-over"); });
    ownerSlot.addEventListener("dragleave", function(){ ownerSlot.classList.remove("drag-over"); });
    ownerSlot.addEventListener("drop", function(e){
      e.preventDefault(); ownerSlot.classList.remove("drag-over");
      var rid = e.dataTransfer.getData("text/plain");
      if (rid) placeOwner(rid);
    });

    function placeOwner(roleId){
      state.ownerChoice = roleId;
      var role = roleById(roleId);
      ownerSlot.classList.add("filled");
      ownerSlot.innerHTML = '<span class="slot-label">Primary Owner</span><div class="placed-card pop">'+role.icon+' <strong>'+role.name+'</strong></div>';
      Array.prototype.forEach.call(rolePool.querySelectorAll(".role-card"), function(c){
        c.classList.toggle("used", c.getAttribute("data-role") === roleId);
      });
      buildAssistPool(roleId);
      document.getElementById("submitS1").disabled = false;
    }

    function buildAssistPool(ownerId){
      var assistPrompt = document.getElementById("assistPrompt");
      var assistPool = document.getElementById("assistPool");
      assistPrompt.style.display = "block";
      assistPool.style.display = "flex";
      assistPool.innerHTML = "";
      state.assistChoice = [];
      ROLES.filter(function(r){ return r.id !== ownerId; }).forEach(function(role){
        var card = el(roleCardHTML(role, {extraClass:"chip-toggle", draggable:false}));
        card.addEventListener("click", function(){
          var idx = state.assistChoice.indexOf(role.id);
          if (idx >= 0){ state.assistChoice.splice(idx,1); card.classList.remove("picked"); }
          else { state.assistChoice.push(role.id); card.classList.add("picked"); }
        });
        assistPool.appendChild(card);
      });
    }

    document.getElementById("submitS1").addEventListener("click", function(){
      if (state.revealed || !state.ownerChoice) return;
      state.revealed = true;
      var correct = state.ownerChoice === task.owner;
      var correctRole = roleById(task.owner);
      var assistTags = task.assist.map(function(id){
        var r = roleById(id);
        return '<span class="assist-tag">'+r.icon+' '+r.name+'</span>';
      }).join("");
      var overlap = state.assistChoice.filter(function(a){ return task.assist.indexOf(a) >= 0; }).length;
      var unionSize = (new Set(state.assistChoice.concat(task.assist))).size;
      var delegationScore = unionSize === 0 ? 100 : Math.round((overlap/unionSize)*100);

      state.s1Results.push({
        taskId: task.id,
        ownerCorrect: correct,
        chosenAssist: state.assistChoice.slice(),
        correctAssist: task.assist.slice(),
        delegationScore: delegationScore
      });

      var reveal = el(
        '<div class="reveal '+(correct?"":"miss")+'">'+
          '<h3>'+(correct ? "✓ You matched the primary owner" : "✓ Primary Owner: "+correctRole.icon+" "+correctRole.name)+'</h3>'+
          '<p><strong>Why they own it:</strong> '+task.why+'</p>'+
          '<p><strong>Roles who may assist:</strong></p>'+
          '<div class="assist-tags">'+assistTags+'</div>'+
          '<p style="margin-top:12px;"><strong>Your delegation match:</strong> '+delegationScore+'% overlap with how this typically gets supported.</p>'+
        '</div>'
      );
      document.getElementById("revealArea").innerHTML = "";
      document.getElementById("revealArea").appendChild(reveal);
      document.getElementById("submitS1").outerHTML = '<button class="btn" id="nextS1">'+(state.s1Index < 2 ? "Next task" : "Continue to Stage 2")+'</button>';
      document.getElementById("nextS1").addEventListener("click", function(){
        if (state.s1Index < 2){ state.s1Index++; renderStage1(); }
        else { state.stage = "s2"; state.s2Index = 0; renderStage2(); }
      });
      updateProgress();
    });
  }

  /* =========================================================
     STAGE 2 — Task Routing
  ========================================================= */
  function renderStage2(){
    updateProgress();
    state.revealed = false;
    app.innerHTML = "";
    var task = state.s2Tasks[state.s2Index];
    var n = task.steps.length;
    state.slotFill = new Array(n).fill(null);

    var slotsHTML = "";
    for (var i=0;i<n;i++){
      slotsHTML += '<div class="slot" data-index="'+i+'"><span class="slot-label">Step '+(i+1)+'</span><span class="step-index"></span></div>';
      if (i < n-1) slotsHTML += '<div class="arrow-between">→</div>';
    }

    var panel = el(
      '<div class="panel">'+
        '<h2 class="stage-title">Stage 2 · Task Routing — Task '+(state.s2Index+1)+' of 3</h2>'+
        '<div class="ticket pop">'+
          '<div class="ticket-tag">Build the workflow ('+n+' steps)</div>'+
          '<div class="ticket-text">'+task.text+'</div>'+
          '<div class="ticket-id">#TC-'+(2000+state.s2Index)+'</div>'+
        '</div>'+
        '<p class="lede center" style="margin-bottom:8px;">Drag roles into order, or tap a role then tap a step slot.</p>'+
        '<div class="slot-row" id="slotRow">'+slotsHTML+'</div>'+
        '<div class="role-pool" id="rolePool2"></div>'+
        '<div class="btn-row"><button class="btn ghost" id="clearS2">Clear</button><button class="btn" id="submitS2" disabled>Submit route</button></div>'+
        '<div id="flowLane"></div>'+
        '<div id="revealArea2"></div>'+
      '</div>'
    );
    app.appendChild(panel);

    var rolePool2 = document.getElementById("rolePool2");
    var slots = Array.prototype.slice.call(document.querySelectorAll("#slotRow .slot"));

    function refreshUsed(){
      Array.prototype.forEach.call(rolePool2.querySelectorAll(".role-card"), function(c){
        c.classList.toggle("used", state.slotFill.indexOf(c.getAttribute("data-role")) >= 0);
      });
      document.getElementById("submitS2").disabled = state.slotFill.indexOf(null) >= 0;
    }

    function placeAt(index, roleId){
      if (state.slotFill.indexOf(roleId) >= 0) return; // already placed elsewhere
      state.slotFill[index] = roleId;
      var role = roleById(roleId);
      var slot = slots[index];
      slot.classList.add("filled");
      slot.innerHTML = '<span class="slot-label">Step '+(index+1)+'</span><div class="placed-card pop">'+role.icon+' <strong>'+role.name+'</strong></div>';
      refreshUsed();
    }

    ROLES.forEach(function(role){
      var card = el(roleCardHTML(role));
      card.addEventListener("dragstart", function(e){
        card.classList.add("dragging");
        e.dataTransfer.setData("text/plain", role.id);
      });
      card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
      card.addEventListener("click", function(){
        if (card.classList.contains("used")) return;
        if (state.selectedForDrag === role.id){
          state.selectedForDrag = null; card.classList.remove("selected"); return;
        }
        Array.prototype.forEach.call(rolePool2.querySelectorAll(".role-card"), function(c){ c.classList.remove("selected"); });
        state.selectedForDrag = role.id;
        card.classList.add("selected");
      });
      rolePool2.appendChild(card);
    });

    slots.forEach(function(slot, idx){
      slot.addEventListener("dragover", function(e){ e.preventDefault(); slot.classList.add("drag-over"); });
      slot.addEventListener("dragleave", function(){ slot.classList.remove("drag-over"); });
      slot.addEventListener("drop", function(e){
        e.preventDefault(); slot.classList.remove("drag-over");
        if (state.slotFill[idx] !== null) return;
        var rid = e.dataTransfer.getData("text/plain");
        if (rid) placeAt(idx, rid);
      });
      slot.addEventListener("click", function(){
        if (state.slotFill[idx] !== null || !state.selectedForDrag) return;
        placeAt(idx, state.selectedForDrag);
        state.selectedForDrag = null;
        Array.prototype.forEach.call(rolePool2.querySelectorAll(".role-card"), function(c){ c.classList.remove("selected"); });
      });
    });

    document.getElementById("clearS2").addEventListener("click", function(){
      if (state.revealed) return;
      renderStage2();
    });

    document.getElementById("submitS2").addEventListener("click", function(){
      if (state.revealed) return;
      state.revealed = true;
      var correctCount = 0;
      for (var i=0;i<n;i++){ if (state.slotFill[i] === task.steps[i]) correctCount++; }
      var score = Math.round((correctCount/n)*100);
      state.s2Results.push({ taskId: task.id, score: score, correctCount: correctCount, total: n });

      var flowLane = document.getElementById("flowLane");
      var laneHTML = '<div class="flow-lane" id="animLane"><div class="ticket-travel">🎫</div></div>';
      flowLane.innerHTML = laneHTML;
      var lane = document.getElementById("animLane");
      task.steps.forEach(function(rid, i){
        var role = roleById(rid);
        var node = document.createElement("div");
        node.className = "flow-node";
        node.innerHTML = '<div style="font-size:20px;">'+role.icon+'</div><div>'+role.name.split(" ")[0]+'</div>';
        setTimeout(function(){ node.classList.add("show"); }, 250*i + 400);
        lane.appendChild(node);
        if (i < n-1){
          var arrow = document.createElement("div");
          arrow.className = "flow-arrow"; arrow.textContent = "→";
          setTimeout(function(){ arrow.classList.add("show"); }, 250*i + 550);
          lane.appendChild(arrow);
        }
      });

      var correctChain = task.steps.map(function(id){ var r = roleById(id); return r.icon+" "+r.name; }).join("  →  ");
      var reveal = el(
        '<div class="reveal '+(correctCount===n ? "" : "miss")+'">'+
          '<h3>'+(correctCount===n ? "✓ That matches the common routing" : "Common routing: "+correctCount+"/"+n+" steps matched")+'</h3>'+
          '<p><strong>Typical flow:</strong> '+correctChain+'</p>'+
          '<p><strong>Why this order:</strong> '+task.why+'</p>'+
        '</div>'
      );
      document.getElementById("revealArea2").innerHTML = "";
      document.getElementById("revealArea2").appendChild(reveal);
      document.getElementById("submitS2").outerHTML = '<button class="btn" id="nextS2">'+(state.s2Index < 2 ? "Next task" : "Continue to Stage 3")+'</button>';
      document.getElementById("clearS2").style.display = "none";
      document.getElementById("nextS2").addEventListener("click", function(){
        if (state.s2Index < 2){ state.s2Index++; renderStage2(); }
        else { state.stage = "s3"; state.s3Index = 0; renderStage3(); }
      });
      updateProgress();
    });
  }

  /* =========================================================
     STAGE 3 — Collaboration Challenge
  ========================================================= */
  function renderStage3(){
    updateProgress();
    state.revealed = false;
    state.pickPrimary = null;
    state.pickSupport = [];
    app.innerHTML = "";
    var task = state.s3Tasks[state.s3Index];

    var panel = el(
      '<div class="panel">'+
        '<h2 class="stage-title">Stage 3 · Collaboration Challenge — Scenario '+(state.s3Index+1)+' of 3</h2>'+
        '<div class="ticket pop">'+
          '<div class="ticket-tag">Org-wide situation</div>'+
          '<div class="ticket-text">'+task.text+'</div>'+
          '<div class="ticket-id">#TC-'+(3000+state.s3Index)+'</div>'+
        '</div>'+
        '<p class="lede center" style="margin-bottom:4px;">Tap one role first as the <strong>primary owner</strong>, then tap up to three more as <strong>supporting</strong>.</p>'+
        '<div class="picker-legend"><span><span class="legend-dot" style="background:var(--gold)"></span>Primary owner</span><span><span class="legend-dot" style="background:rgba(245,196,81,0.4)"></span>Supporting</span></div>'+
        '<div class="role-grid" id="roleGrid3"></div>'+
        '<div class="btn-row"><button class="btn ghost" id="clearS3">Clear</button><button class="btn" id="submitS3" disabled>Submit team</button></div>'+
        '<div id="revealArea3"></div>'+
      '</div>'
    );
    app.appendChild(panel);

    var grid = document.getElementById("roleGrid3");
    ROLES.forEach(function(role){
      var card = el(roleCardHTML(role, {extraClass:"chip-toggle", draggable:false}));
      card.addEventListener("click", function(){
        if (state.pickPrimary === role.id){
          state.pickPrimary = null; card.classList.remove("primary-picked");
        } else if (state.pickSupport.indexOf(role.id) >= 0){
          state.pickSupport.splice(state.pickSupport.indexOf(role.id),1); card.classList.remove("picked");
        } else if (!state.pickPrimary){
          state.pickPrimary = role.id; card.classList.add("primary-picked");
        } else if (state.pickSupport.length < 3){
          state.pickSupport.push(role.id); card.classList.add("picked");
        }
        document.getElementById("submitS3").disabled = !state.pickPrimary;
      });
      grid.appendChild(card);
    });

    document.getElementById("clearS3").addEventListener("click", function(){
      if (state.revealed) return;
      renderStage3();
    });

    document.getElementById("submitS3").addEventListener("click", function(){
      if (state.revealed || !state.pickPrimary) return;
      state.revealed = true;
      var chosenSet = [state.pickPrimary].concat(state.pickSupport);
      var idealSet = [task.primary].concat(task.supporting);
      var overlap = chosenSet.filter(function(id){ return idealSet.indexOf(id) >= 0; }).length;
      var unionSize = (new Set(chosenSet.concat(idealSet))).size;
      var collabScore = Math.round((overlap/unionSize)*100);
      var extraCount = chosenSet.filter(function(id){ return idealSet.indexOf(id) < 0; }).length;
      var missedCount = idealSet.filter(function(id){ return chosenSet.indexOf(id) < 0; }).length;

      state.s3Results.push({
        taskId: task.id, score: collabScore,
        chosenSet: chosenSet, idealSet: idealSet,
        extraCount: extraCount, missedCount: missedCount
      });

      var primaryMatch = state.pickPrimary === task.primary;
      var supportingTags = task.supporting.map(function(id){ var r = roleById(id); return '<span class="assist-tag">'+r.icon+' '+r.name+'</span>'; }).join("");
      var primaryRole = roleById(task.primary);

      var reveal = el(
        '<div class="reveal '+(collabScore>=60 ? "" : "miss")+'">'+
          '<h3>'+(primaryMatch ? "✓ You identified the primary owner" : "Primary Owner: "+primaryRole.icon+" "+primaryRole.name)+'</h3>'+
          '<p><strong>Supporting teams:</strong></p>'+
          '<div class="assist-tags">'+supportingTags+'</div>'+
          '<p style="margin-top:10px;"><strong>Reasoning:</strong> '+task.why+'</p>'+
          '<p><strong>Possible communication flow:</strong> '+task.flow+'</p>'+
          '<p style="margin-top:10px;"><strong>Your team match:</strong> '+collabScore+'% overlap with this typical response team.</p>'+
        '</div>'
      );
      document.getElementById("revealArea3").innerHTML = "";
      document.getElementById("revealArea3").appendChild(reveal);
      document.getElementById("submitS3").outerHTML = '<button class="btn" id="nextS3">'+(state.s3Index < 2 ? "Next scenario" : "See my results")+'</button>';
      document.getElementById("clearS3").style.display = "none";
      document.getElementById("nextS3").addEventListener("click", function(){
        if (state.s3Index < 2){ state.s3Index++; renderStage3(); }
        else { state.stage = "results"; renderResults(); }
      });
      updateProgress();
    });
  }

  /* =========================================================
     RESULTS
  ========================================================= */
  function computeScores(){
    var ownership = Math.round((state.s1Results.filter(function(r){ return r.ownerCorrect; }).length / 3) * 100);
    var delegation = Math.round(state.s1Results.reduce(function(sum,r){ return sum + r.delegationScore; },0) / 3);
    var workflow = Math.round(state.s2Results.reduce(function(sum,r){ return sum + r.score; },0) / 3);
    var collaboration = Math.round(state.s3Results.reduce(function(sum,r){ return sum + r.score; },0) / 3);
    return { ownership: ownership, delegation: delegation, workflow: workflow, collaboration: collaboration };
  }

  function buildRadarSVG(scores){
    var cats = [
      {label:"Ownership", value:scores.ownership},
      {label:"Delegation", value:scores.delegation},
      {label:"Workflow", value:scores.workflow},
      {label:"Collaboration", value:scores.collaboration}
    ];
    var cx=140, cy=140, r=104;
    var n = cats.length;
    function pointAt(i, val){
      var angle = (Math.PI*2*i/n) - Math.PI/2;
      var radius = (val/100)*r;
      return { x: cx + radius*Math.cos(angle), y: cy + radius*Math.sin(angle) };
    }
    var poly = cats.map(function(c,i){ var p = pointAt(i, c.value); return p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
    var rings = [0.25,0.5,0.75,1].map(function(f){
      var pts = cats.map(function(c,i){ var p = pointAt(i, 100*f); return p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
      return '<polygon points="'+pts+'" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>';
    }).join("");
    var axes = cats.map(function(c,i){
      var p = pointAt(i, 100);
      return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>';
    }).join("");
    var labels = cats.map(function(c,i){
      var p = pointAt(i, 122);
      return '<text x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'" text-anchor="middle" font-size="11.5" fill="#9aa4bd" font-weight="600">'+c.label+'</text>';
    }).join("");
    var dots = cats.map(function(c,i){
      var p = pointAt(i, c.value);
      return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="#f5c451"/>';
    }).join("");
    return '<svg viewBox="0 0 280 290" width="280" height="290">'+
        rings + axes +
        '<polygon points="'+poly+'" fill="rgba(245,196,81,0.22)" stroke="#f5c451" stroke-width="2"/>'+
        dots + labels +
      '</svg>';
  }

  function renderResults(){
    updateProgress();
    app.innerHTML = "";
    var scores = computeScores();

    var totalExtra = state.s3Results.reduce(function(s,r){ return s+r.extraCount; },0);
    var totalMissed = state.s3Results.reduce(function(s,r){ return s+r.missedCount; },0);
    var s1Extra = 0, s1Missed = 0;
    state.s1Results.forEach(function(r){
      s1Extra += r.chosenAssist.filter(function(id){ return r.correctAssist.indexOf(id)<0; }).length;
      s1Missed += r.correctAssist.filter(function(id){ return r.chosenAssist.indexOf(id)<0; }).length;
    });
    totalExtra += s1Extra; totalMissed += s1Missed;

    var catList = [
      {name:"Ownership", value:scores.ownership},
      {name:"Delegation", value:scores.delegation},
      {name:"Workflow Thinking", value:scores.workflow},
      {name:"Collaboration", value:scores.collaboration}
    ];
    var best = catList.slice().sort(function(a,b){ return b.value-a.value; })[0];

    var reflectCards = "";
    reflectCards += '<div class="reflect-card"><div class="emoji">🌟</div><p><strong>What you understood well:</strong> your strongest area was <strong>'+best.name+'</strong> at '+best.value+'%, suggesting a solid instinct for that part of how work moves through a team.</p></div>';

    if (totalExtra > totalMissed + 1){
      reflectCards += '<div class="reflect-card"><div class="emoji">🧭</div><p><strong>Where you tended to over-assign responsibility:</strong> you often pulled in more roles than a scenario typically needed. Broad involvement feels safe, but it can slow decisions down and blur who is actually accountable.</p></div>';
    } else if (totalMissed > totalExtra + 1){
      reflectCards += '<div class="reflect-card"><div class="emoji">🤝</div><p><strong>Where you underestimated collaboration:</strong> you tended to keep responses narrower than the situations called for. Some of these problems usually move faster when a couple of extra teams are looped in early rather than after the fact.</p></div>';
    } else {
      reflectCards += '<div class="reflect-card"><div class="emoji">⚖️</div><p><strong>Balance:</strong> your instinct for how wide to spread responsibility was fairly close to how these situations typically play out, neither over-including nor under-including teams by much.</p></div>';
    }

    var insight = INSIGHTS[Math.floor(Math.random()*INSIGHTS.length)];
    reflectCards += '<div class="reflect-card insight-card"><div class="emoji">💡</div><p><strong>One insight:</strong> '+insight+'</p></div>';

    var panel = el(
      '<div class="panel center pop">'+
        '<h2 class="stage-title">Simulation Complete</h2>'+
        '<h1 class="big">Here is how you tend to move work</h1>'+
        '<p class="lede">Not a score out of 100 — a picture of your instincts around ownership, delegation, routing and collaboration.</p>'+
        '<div class="score-grid">'+
          '<div class="bars">'+
            catList.map(function(c){
              return '<div class="bar-row"><div class="bar-label"><span>'+c.name+'</span><span>'+c.value+'%</span></div><div class="bar-track"><div class="bar-fill" data-w="'+c.value+'" style="background:linear-gradient(90deg,#f5c451,#ef6ba8);"></div></div></div>';
            }).join("")+
          '</div>'+
          '<div class="radar-wrap">'+buildRadarSVG(scores)+'</div>'+
        '</div>'+
        '<div class="reflect-block" style="text-align:left;">'+reflectCards+'</div>'+
        '<div class="btn-row"><button class="btn" id="restartBtn">Run a new simulation</button></div>'+
      '</div>'
    );
    app.appendChild(panel);

    setTimeout(function(){
      Array.prototype.forEach.call(document.querySelectorAll(".bar-fill"), function(b){
        b.style.width = b.getAttribute("data-w")+"%";
      });
    }, 60);

    makeConfetti();

    document.getElementById("restartBtn").addEventListener("click", function(){
      state.s1Results = []; state.s2Results = []; state.s3Results = [];
      state.stage = "intro";
      renderIntro();
    });
  }

  /* =========================================================
     BOOT
  ========================================================= */
  renderIntro();
})();
</script>
</body>
</html>
