<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Think Like a Marketing Strategist</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#0A0C10;
    --bg-alt:#0D1016;
    --panel:#12151C;
    --panel-alt:#171B24;
    --border:#242A36;
    --border-soft:#1B2029;
    --text:#E9EDF3;
    --text-dim:#8993A6;
    --text-faint:#565F72;
    --teal:#49E0C6;
    --teal-dim:#2A6E63;
    --coral:#FF8266;
    --coral-dim:#7A3F32;
    --gold:#E9BE55;
    --violet:#9C8CFB;
    --font-display:'Space Grotesk','Avenir Next','Segoe UI',system-ui,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
    --font-mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(73,224,198,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(156,140,251,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  ::selection{background:rgba(73,224,198,0.25);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#232936;border-radius:8px;}

  .app-shell{
    max-width:1280px;
    margin:0 auto;
    padding:20px 20px 60px;
    display:grid;
    grid-template-columns:240px 1fr 280px;
    gap:22px;
  }
  @media (max-width:1080px){
    .app-shell{grid-template-columns:1fr;}
    .rail-desktop{display:none;}
    .ledger-desktop{display:none;}
  }

  /* HEADER */
  .top-header{
    grid-column:1 / -1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 4px 4px;
    margin-bottom:4px;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark .dot{
    width:11px;height:11px;border-radius:3px;
    background:var(--teal);
    box-shadow:0 0 14px rgba(73,224,198,.7);
    transform:rotate(45deg);
  }
  .brand-mark .word{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--text);
  }
  .brand-mark .sub{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-faint);
    letter-spacing:.08em;
    margin-left:8px;
  }
  .top-progress{
    display:flex;align-items:center;gap:10px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
  }
  .top-progress .bar{
    width:140px;height:5px;border-radius:4px;
    background:var(--border-soft);
    overflow:hidden;
  }
  .top-progress .fill{
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--violet));
    transition:width .5s ease;
  }
  .mobile-ledger-toggle{
    display:none;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.06em;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  @media (max-width:1080px){
    .mobile-ledger-toggle{display:inline-block;}
  }

  /* RAIL */
  .rail{
    display:flex;flex-direction:column;gap:2px;
    position:sticky;top:20px;align-self:start;
  }
  .rail-title{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.14em;
    color:var(--text-faint);
    text-transform:uppercase;
    margin:0 0 10px 4px;
  }
  .rail-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;
    border-radius:9px;
    cursor:default;
    opacity:.4;
    transition:all .25s ease;
  }
  .rail-item.done{opacity:.75;cursor:pointer;}
  .rail-item.active{
    opacity:1;
    background:var(--panel);
    border:1px solid var(--border);
  }
  .rail-item .num{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-faint);
    width:26px;
  }
  .rail-item.active .num{color:var(--teal);}
  .rail-item.done .num{color:var(--text-dim);}
  .rail-item .label{
    font-size:12.5px;
    color:var(--text-dim);
    font-weight:500;
  }
  .rail-item.active .label{color:var(--text);}

  /* MAIN COLUMN */
  main{min-width:0;}
  .stage{
    animation:riseIn .45s ease both;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .dossier-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .dossier-header .exhibit{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--teal);
    letter-spacing:.1em;
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .dossier-header h1{
    font-family:var(--font-display);
    font-size:clamp(22px,3vw,30px);
    margin:0;
    line-height:1.15;
    letter-spacing:-0.01em;
  }
  .dossier-header p.tag{
    color:var(--text-dim);
    font-size:14px;
    margin:8px 0 0;
    max-width:56ch;
    line-height:1.55;
  }
  .stamp{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--coral);
    border:1px solid var(--coral-dim);
    padding:5px 9px;
    border-radius:6px;
    transform:rotate(3deg);
    white-space:nowrap;
    background:rgba(255,130,102,0.06);
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
    position:relative;
  }
  .card.folded::before{
    content:'';
    position:absolute;top:0;right:0;
    width:0;height:0;
    border-style:solid;
    border-width:0 18px 18px 0;
    border-color:transparent var(--bg) transparent transparent;
  }
  .card.folded::after{
    content:'';
    position:absolute;top:0;right:0;
    width:0;height:0;
    border-style:solid;
    border-width:0 18px 18px 0;
    border-color:transparent var(--border) transparent transparent;
    opacity:.6;
  }
  .card h3{
    font-family:var(--font-display);
    font-size:15.5px;
    margin:0 0 8px;
    display:flex;align-items:center;gap:8px;
  }
  .card p{
    color:var(--text-dim);
    font-size:13.6px;
    line-height:1.6;
    margin:0 0 10px;
  }
  .why-box{
    background:var(--panel-alt);
    border-left:2px solid var(--teal);
    border-radius:0 8px 8px 0;
    padding:10px 14px;
    margin-top:10px;
  }
  .why-box .lbl{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--teal);
    letter-spacing:.08em;
    text-transform:uppercase;
    display:block;
    margin-bottom:4px;
  }
  .why-box p{margin:0;color:var(--text-dim);font-size:13px;}

  /* BUTTONS */
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    padding:11px 20px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--panel-alt);
    color:var(--text);
    cursor:pointer;
    transition:all .18s ease;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{border-color:var(--teal);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn.primary{
    background:linear-gradient(135deg,var(--teal),#33b3a0);
    color:#06110E;
    border:none;
  }
  .btn.primary:hover{box-shadow:0 6px 20px rgba(73,224,198,.25);}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
  .btn.small{padding:7px 12px;font-size:12px;}
  .btn.violet{background:linear-gradient(135deg,var(--violet),#6f5ce0);color:#0d0b1f;border:none;}

  .nav-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:22px;
    gap:10px;flex-wrap:wrap;
  }

  /* CHOICE GRIDS */
  .choice-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:12px;
    margin:16px 0;
  }
  .choice-card{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    cursor:pointer;
    transition:all .2s ease;
    text-align:left;
  }
  .choice-card:hover{border-color:var(--text-faint);transform:translateY(-2px);}
  .choice-card.selected{
    border-color:var(--teal);
    background:linear-gradient(180deg,rgba(73,224,198,.08),rgba(73,224,198,.02));
    box-shadow:0 0 0 1px rgba(73,224,198,.3) inset;
  }
  .choice-card .emoji{font-size:26px;margin-bottom:8px;display:block;}
  .choice-card h4{margin:0 0 4px;font-family:var(--font-display);font-size:14.5px;}
  .choice-card .desc{color:var(--text-dim);font-size:12.5px;line-height:1.5;margin:0;}
  .choice-card .fit{
    margin-top:10px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.05em;
  }
  .fit-stars{color:var(--gold);}

  .tag-pill{
    display:inline-block;
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    border:1px solid var(--border);
    color:var(--text-dim);
    margin:2px 4px 0 0;
  }

  /* FORMS */
  label.field-label{
    display:block;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin:14px 0 6px;
  }
  input[type=text], textarea, select{
    width:100%;
    background:var(--bg-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 13px;
    border-radius:9px;
    font-family:var(--font-body);
    font-size:13.5px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus, textarea:focus, select:focus{border-color:var(--teal);}
  textarea{resize:vertical;min-height:70px;}

  /* HOW TO ASK CLAUDE CARD */
  .prompt-card{
    background:linear-gradient(160deg,rgba(156,140,251,.08),rgba(73,224,198,.04));
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:18px 20px;
    margin:20px 0;
  }
  .prompt-card .hdr{
    display:flex;align-items:center;gap:8px;
    margin-bottom:8px;
  }
  .prompt-card .hdr .ic{
    width:22px;height:22px;border-radius:6px;
    background:var(--violet);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
  }
  .prompt-card .hdr .t{
    font-family:var(--font-display);
    font-size:13.5px;
    color:var(--violet);
  }
  .prompt-card p.expl{
    color:var(--text-dim);font-size:12.5px;margin:0 0 10px;line-height:1.5;
  }
  .prompt-box{
    background:var(--bg-alt);
    border:1px dashed var(--border);
    border-radius:9px;
    padding:12px 14px;
    font-family:var(--font-mono);
    font-size:12px;
    line-height:1.65;
    color:#C9D6E8;
    white-space:pre-wrap;
  }
  .copy-btn{
    margin-top:10px;
  }

  /* WEEK / ROADMAP */
  .week-card{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
    display:grid;
    grid-template-columns:60px 1fr;
    gap:14px;
  }
  .week-card .wk{
    font-family:var(--font-display);
    font-size:22px;
    color:var(--text-faint);
  }
  .week-card h4{margin:0 0 6px;font-size:14.5px;font-family:var(--font-display);}
  .week-card .goal{color:var(--teal);font-size:11.5px;font-family:var(--font-mono);letter-spacing:.04em;margin-bottom:6px;}
  .week-card p{margin:0;color:var(--text-dim);font-size:13px;line-height:1.55;}

  /* EVENT */
  .event-banner{
    background:linear-gradient(135deg,rgba(255,130,102,.12),rgba(255,130,102,.02));
    border:1px solid var(--coral-dim);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:18px;
  }
  .event-banner .kicker{
    font-family:var(--font-mono);font-size:10.5px;color:var(--coral);
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:block;
  }
  .response-option{
    display:block;width:100%;text-align:left;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:11px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .18s ease;
    color:var(--text);
  }
  .response-option:hover{border-color:var(--teal);}
  .response-option.chosen{border-color:var(--teal);background:rgba(73,224,198,.06);}
  .response-option .r-title{font-weight:600;font-size:13.5px;margin-bottom:4px;}
  .response-option .r-desc{color:var(--text-dim);font-size:12.5px;line-height:1.5;}
  .consequence{
    margin-top:14px;
    background:var(--bg-alt);
    border-left:2px solid var(--gold);
    border-radius:0 8px 8px 0;
    padding:12px 14px;
  }
  .consequence .lbl{font-family:var(--font-mono);font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:5px;}
  .consequence p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.55;}

  /* REPORT */
  .report-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin:16px 0 20px;
  }
  .score-card{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
  }
  .score-card .lbl{
    font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;display:block;
  }
  .ring-wrap{display:flex;align-items:center;gap:12px;}
  .ring-num{font-family:var(--font-display);font-size:24px;}
  .score-bar-track{
    flex:1;height:7px;background:var(--border-soft);border-radius:6px;overflow:hidden;
  }
  .score-bar-fill{height:100%;border-radius:6px;transition:width 1s ease;}

  .verdict-row{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;
  }
  @media (max-width:640px){.verdict-row{grid-template-columns:1fr;}}
  .verdict-card{
    border-radius:12px;padding:16px;
  }
  .verdict-card.good{background:rgba(73,224,198,.07);border:1px solid var(--teal-dim);}
  .verdict-card.bad{background:rgba(255,130,102,.07);border:1px solid var(--coral-dim);}
  .verdict-card .lbl{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    display:block;margin-bottom:6px;
  }
  .verdict-card.good .lbl{color:var(--teal);}
  .verdict-card.bad .lbl{color:var(--coral);}
  .verdict-card p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.55;}

  .lesson-item{
    display:flex;gap:12px;
    padding:12px 0;
    border-top:1px solid var(--border-soft);
  }
  .lesson-item:first-child{border-top:none;}
  .lesson-item .n{
    font-family:var(--font-display);font-size:18px;color:var(--text-faint);width:26px;flex-shrink:0;
  }
  .lesson-item p{margin:0;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
  .lesson-item strong{color:var(--text);}

  /* LEDGER SIDEBAR */
  .ledger{
    position:sticky;top:20px;align-self:start;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    max-height:82vh;
    overflow-y:auto;
  }
  .ledger .hdr{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .ledger .hdr .t{
    font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
    letter-spacing:.1em;text-transform:uppercase;
  }
  .ledger .maturity{
    font-family:var(--font-mono);font-size:10px;color:var(--teal);
  }
  .ledger-entry{
    padding:10px 0;
    border-top:1px dashed var(--border-soft);
    animation:riseIn .4s ease both;
  }
  .ledger-entry:first-child{border-top:none;}
  .ledger-entry .tag{
    font-family:var(--font-mono);font-size:9.5px;color:var(--violet);
    letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px;
  }
  .ledger-entry .txt{font-size:12px;color:var(--text-dim);line-height:1.5;}
  .ledger-empty{color:var(--text-faint);font-size:12px;font-style:italic;}

  .ledger-mobile-drawer{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    z-index:50;display:flex;justify-content:flex-end;
  }
  .ledger-mobile-drawer .panel{
    width:min(340px,88vw);height:100%;
    background:var(--panel);border-left:1px solid var(--border);
    padding:18px;overflow-y:auto;
  }

  /* WELCOME */
  .hero{
    text-align:left;
    padding:34px 0 10px;
  }
  .hero .eyebrow{
    font-family:var(--font-mono);font-size:11.5px;color:var(--teal);
    letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;display:block;
  }
  .hero h1{
    font-family:var(--font-display);
    font-size:clamp(30px,5vw,48px);
    line-height:1.08;
    margin:0 0 16px;
    letter-spacing:-0.01em;
  }
  .hero h1 .hl{color:var(--teal);}
  .hero p.lead{
    font-size:15.5px;color:var(--text-dim);max-width:60ch;line-height:1.65;margin:0 0 22px;
  }
  .principle-row{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:22px 0 8px;
  }
  .principle{
    border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--panel);
  }
  .principle .k{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block;}
  .principle p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.5;}

  .progress-strip{
    display:flex;gap:4px;margin:18px 0;
  }
  .progress-strip .seg{flex:1;height:4px;border-radius:3px;background:var(--border-soft);}
  .progress-strip .seg.on{background:var(--teal);}

  .selected-check{
    position:absolute;top:12px;right:12px;
    width:18px;height:18px;border-radius:50%;
    background:var(--teal);color:#06110E;
    font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  .lock-note{
    font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-top:8px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useMemo, useRef, useEffect} = React;

/* ============ DATA ============ */

const RANDOM_BUSINESSES = [

/* ============ HELPERS ============ */

function clamp(n,min,max){return Math.max(min,Math.min(max,n));}

function scorePlatform(p, mode, text){
  let s = mode === 'personal' ? p.personalBase : p.base;
  const lower = text.toLowerCase();
  Object.keys(p.kw).forEach(k=>{
    if(lower.includes(k)) s += p.kw[k];
  });
  return clamp(s,1,5);
}

function starString(n){
  return '★'.repeat(n) + '☆'.repeat(5-n);
}

function uid(){return Math.random().toString(36).slice(2,9);}

/* ============ SMALL COMPONENTS ============ */

function WhyBox({children}){
  return (
    <div className="why-box">
      <span className="lbl">Why this matters</span>
      <p>{children}</p>
    </div>
  );
}

function PromptCard({title, explanation, prompt}){
  const [copied, setCopied] = useState(false);
  const doCopy = () => {
    const ta = document.createElement('textarea');
    ta.value = prompt;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    setCopied(true);
    setTimeout(()=>setCopied(false), 1800);
  };
  return (
    <div className="prompt-card">
      <div className="hdr">
        <div className="ic">🤖</div>
        <div className="t">How to ask Claude</div>
      </div>
      <p className="expl">{explanation}</p>
      <div className="prompt-box">{prompt}</div>
      <button className="btn small copy-btn" onClick={doCopy}>
        {copied ? '✓ Copied' : '📋 Copy prompt'}
      </button>
    </div>
  );
}

function ScoreCard({label, value, color}){
  return (
    <div className="score-card">
      <span className="lbl">{label}</span>
      <div className="ring-wrap">
        <div className="ring-num" style={{color}}>{value}/10</div>
        <div className="score-bar-track">
          <div className="score-bar-fill" style={{width:(value*10)+'%', background:color}} />
        </div>
      </div>
    </div>
  );
}

function Understand({mode, data, onNext}){
  const isPersonal = mode === 'personal';
  const nameField = isPersonal ? data.name : data.name;
  const nicheField = isPersonal ? data.niche : data.industry;
  const audienceField = data.audience;
  const compField = data.competitors;

  const promptText = isPersonal
    ? `Act as a personal branding strategist. My name is ${nameField || '[name]'} and my area of expertise is ${nicheField || '[niche]'}. My target audience is ${audienceField || '[audience]'}. Help me write a one-sentence point of view statement that makes my expertise instantly clear, and identify the single biggest gap between how I currently present myself and how my audience actually thinks about this topic.`
    : `Act as a marketing strategist. My business is ${nameField || '[business name]'}, in the ${nicheField || '[industry]'} industry, targeting ${audienceField || '[audience]'}. My main competitors are ${compField || '[competitors]'}. Help me build a clear audience persona (goals, objections, and where they spend time online) and identify the single biggest gap in how I currently talk to them.`;

  return (
    <div className="stage">
      <div className="dossier-header">
        <div>
          <p className="exhibit">Exhibit 03 — Understanding the Brand</p>

      </div>

      <div className="card">
        <h3>🎯 {isPersonal ? 'What is your "product"?' : 'What is this business, really?'}</h3>
        <p>
          {isPersonal
            ? <>For a personal brand, your product isn't a physical thing — it's <strong style={{color:'var(--text)'}}>{nicheField || 'your expertise'}</strong>, proven through your story and your point of view. People don't follow topics, they follow perspectives on topics.</>
            : <><strong style={{color:'var(--text)'}}>{nameField}</strong> operates in <strong style={{color:'var(--text)'}}>{nicheField}</strong>. Every marketing decision from here should trace back to solving one thing for one audience — not appealing to everyone.</>
          }
        </p>
        <WhyBox>
          {isPersonal

      </div>

      <div className="card">
        <h3>👥 Who is on the other side?</h3>
        <p><strong style={{color:'var(--text)'}}>Audience:</strong> {audienceField || 'Not yet defined.'}</p>
        <p>
          {isPersonal
            ? 'Think about what this audience is trying to figure out, and what would make them trust one voice over another. That trust is what you\'re building, post by post.'
            : 'Think about what this audience currently does instead of choosing you — including doing nothing at all. That "next best alternative" is your real competition, not just the obvious brands.'}
        </p>
        <WhyBox>
          Audience understanding isn't demographics — it's knowing what someone is trying to accomplish

        </WhyBox>
      </div>

      <div className="card">
        <h3>{isPersonal ? '🌟 People in your space you admire' : '⚔️ Competitors'}</h3>
        <p>{compField || 'Not yet defined.'}</p>

          {isPersonal
            ? "Studying people you admire isn't about copying them — it's about noticing what they do that you genuinely can't or wouldn't do, which is often where your own angle lives."

      <PromptCard
        title="Define your audience"
        explanation="Use this prompt with Claude any time you need to sharpen who you're actually speaking to."
        prompt={promptText}

      <div className="nav-row">

}

/* ============ STEP: PLATFORMS ============ */

function Platforms({mode, data, chosen, setChosen, onNext}){
  const combinedText = mode==='personal'
    ? [data.niche,data.audience,data.story].join(' ')
    : [data.industry,data.audience,data.challenge].join(' ');

  const scored = useMemo(()=>{
    return PLATFORMS.map(p=>({...p, score: scorePlatform(p, mode, combinedText)}))
      .sort((a,b)=>b.score-a.score);
  },[mode, combinedText]);

  const toggle = (key) => {
    setChosen(prev => prev.includes(key) ? prev.filter(k=>k!==key) : [...prev, key]);
  };

  const promptText = `Given my ${mode==='personal' ? 'personal brand' : 'brand'} "${data.name || '[name]'}" targeting ${data.audience || '[audience]'}, analyze which social platforms fit best right now, and explain the trade-off of each one — including which platforms I should deliberately NOT prioritize and why.`;

  return (
    <div className="stage">
      <div className="dossier-header">
        <div>
          <p className="exhibit">Exhibit 04 — Platform Strategy</p>
          <h1>Where should this {mode==='personal'?'voice':'brand'} show up?</h1>
          <p className="tag">Pick platforms deliberately. Every platform you choose is a platform you're committing real time to.</p>
        </div>
      </div>

      {mode==='personal' && (
        <WhyBox>
          For personal brands, LinkedIn, X/Twitter, YouTube, and email newsletters usually carry more weight than
          visual platforms — because trust and ideas travel better through words and long-form thinking than through
          aesthetics alone.
        </WhyBox>
      )}

      <div className="choice-grid" style={{marginTop:16}}>
        {scored.map(p=>{
          const sel = chosen.includes(p.key);
          return (
            <div key={p.key} className={"choice-card" + (sel?" selected":"")} onClick={()=>toggle(p.key)} style={{position:'relative'}}>
              {sel && <div className="selected-check">✓</div>}
              <span className="emoji">{p.emoji}</span>
              <h4>{p.name}</h4>
              <p className="desc">{p.blurb}</p>
              <div className="fit"><span className="fit-stars">{starString(p.score)}</span> <span style={{color:'var(--text-faint)'}}>fit for this brief</span></div>
            </div>
          );
        })}
      </div>

      <p className="lock-note">Selected: {chosen.length} platform{chosen.length!==1?'s':''}. Choose at least 2, but resist choosing all 8 — focus is the point.</p>

      <PromptCard
        title="Evaluate platforms"
        explanation="Reuse this whenever you're deciding where a brand or voice should actually spend time."
        prompt={promptText}
      />

      <div className="nav-row">
        <div></div>
        <button className="btn primary" disabled={chosen.length<2} onClick={onNext}>Next: Content Pillars →</button>
      </div>
    </div>
  );
}

/* ============ STEP: PILLARS ============ */

function Pillars({mode, data, chosen, setChosen, onNext}){
  const pool = mode==='personal' ? PERSONAL_PILLARS : BUSINESS_PILLARS;
  const toggle = (key) => {
    setChosen(prev=>{
      if(prev.includes(key)) return prev.filter(k=>k!==key);
      if(prev.length>=3) return prev;
      return [...prev,key];
    });
  };
  const promptText = `I've chosen these content pillars for ${data.name || '[name]'}: ${chosen.map(k=>pool.find(p=>p.key===k)?.name).join(', ') || '[pillars]'}. Brainstorm 10 specific content ideas for each pillar that stay true to these goals, and tell me if the three pillars together cover enough of the buyer/audience journey or if I'm missing something.`;

  return (
    <div className="stage">
      <div className="dossier-header">
        <div>
          <p className="exhibit">Exhibit 05 — Content Pillars</p>
          <h1>Choose exactly three pillars.</h1>
          <p className="tag">Pillars are recurring themes, not individual posts. Each one should serve a different goal.</p>
        </div>
      </div>

      <div className="choice-grid">
        {pool.map(p=>{
          const sel = chosen.includes(p.key);
          const disabled = !sel && chosen.length>=3;
          return (
            <div key={p.key}
                 className={"choice-card" + (sel?" selected":"") + (disabled?" disabled":"")}
                 style={disabled?{opacity:.35,cursor:'not-allowed',position:'relative'}:{position:'relative'}}
                 onClick={()=>!disabled && toggle(p.key)}>
              {sel && <div className="selected-check">✓</div>}
              <h4>{p.name}</h4>
              <p className="desc">{p.desc}</p>
              <span className="tag-pill">{p.goal}</span>
            </div>
          );
        })}
      </div>
      <p className="lock-note">Selected: {chosen.length}/3.</p>

      <WhyBox>
        Choosing three over eight is the exercise. A brand that tries to cover every pillar ends up with a feed
        that has no discernible personality — pillars work because they repeat.
      </WhyBox>

      <PromptCard
        title="Brainstorm within your pillars"
        explanation="Use this once your three pillars are locked in, to turn strategy into actual post ideas."
        prompt={promptText}
      />

      <div className="nav-row">
        <div></div>
        <button className="btn primary" disabled={chosen.length!==3} onClick={onNext}>Next: 30-Day Roadmap →</button>
      </div>
    </div>
  );
}

/* ============ STEP: ROADMAP ============ */

function buildRoadmap(mode, data, platformNames, pillarNames){
  const p1 = pillarNames[0] || 'your first pillar', p2 = pillarNames[1] || 'your second pillar', p3 = pillarNames[2] || 'your third pillar';
  const plat = platformNames.join(', ') || 'your chosen platforms';
  if(mode==='personal'){
    return [
      {goal:'Define & Optimize', text:`Nail down your point of view in one sentence and rewrite your bio/profile on ${plat} around it. No posting volume yet — clarity first, because an unclear bio wastes every post that follows.`},
      {goal:'Establish Presence', text:`Start publishing consistently, leaning on "${p1}" to prove your expertise early. The goal this week is recognizability, not virality.`},
      {goal:'Build Trust & Voice', text:`Introduce "${p2}" to add a human dimension to your expertise. Start replying to comments and DMs personally — trust compounds through visible responsiveness.`},
      {goal:'Expand Reach', text:`Bring in "${p3}" and try one higher-risk format (a stronger opinion, a longer story) to test what actually travels. Review what resonated and double down next month.`},
    ];
  }
  return [
    {goal:'Audit & Foundation', text:`Audit your current presence on ${plat} and define a consistent brand voice. Fix any obvious gaps (bio, pinned content, visual consistency) before increasing volume.`},
    {goal:'Awareness', text:`Focus on "${p1}" to introduce the brand to people who don't know you yet. This week optimizes for reach, not conversion.`},
    {goal:'Trust', text:`Shift weight toward "${p2}" to prove the product/brand actually delivers. This is where skepticism turns into consideration.`},
    {goal:'Conversion & Review', text:`Bring in "${p3}" with a clear call to action, and review which posts from the last 3 weeks performed best. Double down on the pattern, not just the platform.`},
  ];
}

function Roadmap({mode, data, platformNames, pillarNames, onNext}){
  const weeks = useMemo(()=>buildRoadmap(mode, data, platformNames, pillarNames), [mode, data, platformNames, pillarNames]);
  const promptText = `Create a 4-week content strategy roadmap for ${data.name || '[name]'} on ${platformNames.join(', ') || '[platforms]'}, built around these content pillars: ${pillarNames.join(', ') || '[pillars]'}. Each week should have one clear strategic goal (not a list of individual posts) and a short reason why that goal comes at that point in the roadmap.`;

  return (
    <div className="stage">
      <div className="dossier-header">
        <div>
          <p className="exhibit">Exhibit 06 — 30-Day Roadmap</p>
          <h1>A month, mapped by goal — not by post.</h1>
          <p className="tag">Strategists plan in phases. Each week should build on the one before it.</p>
        </div>
      </div>

      {weeks.map((w,i)=>(
        <div className="week-card" key={i}>
          <div className="wk">W{i+1}</div>
          <div>
            <div className="goal">{w.goal.toUpperCase()}</div>
            <p>{w.text}</p>
          </div>
        </div>
      ))}

      <WhyBox>
        Posting randomly produces noise. A roadmap with weekly goals turns the same amount of effort into a
        story your audience can follow — awareness, then trust, then action.
      </WhyBox>

      <PromptCard
        title="Build a real roadmap"
        explanation="Use this any time you need a strategic (not tactical) content plan."
        prompt={promptText}
      />

      <div className="nav-row">
        <div></div>
        <button className="btn primary" onClick={onNext}>Next: Unexpected Event →</button>
      </div>
    </div>
  );
}

/* ============ STEP: EVENT ============ */

/* ============ STEP: REPORT ============ */

function computeScores({mode, data, platformKeys, pillarKeys, eventDelta}){
  // Audience understanding: based on how filled-out the intake was
  const fields = mode==='personal'
    ? [data.name,data.niche,data.audience,data.story,data.competitors]
    : [data.name,data.industry,data.audience,data.challenge,data.competitors];
  const filledCount = fields.filter(f=>f && f.trim().length>3).length;
  const audienceScore = clamp(Math.round((filledCount/5)*10),3,10);

  // Platform strategy: based on top fit scores of chosen platforms
  const combinedText = mode==='personal'
    ? [data.niche,data.audience,data.story].join(' ')
    : [data.industry,data.audience,data.challenge].join(' ');
  const fits = platformKeys.map(k=>{
    const p = PLATFORMS.find(pp=>pp.key===k);
    return p ? scorePlatform(p, mode, combinedText) : 3;
  });
  const avgFit = fits.length ? fits.reduce((a,b)=>a+b,0)/fits.length : 3;
  const focusPenalty = platformKeys.length>5 ? 2 : (platformKeys.length>4?1:0);
  const platformScore = clamp(Math.round(avgFit*2) - focusPenalty, 2, 10);

  // Content strategy: diversity of goal tags among chosen pillars
  const pool = mode==='personal' ? PERSONAL_PILLARS : BUSINESS_PILLARS;
  const goals = pillarKeys.map(k=>pool.find(p=>p.key===k)?.goal).filter(Boolean);
  const uniqueGoals = new Set(goals).size;
  const contentScore = clamp(4 + uniqueGoals*2, 4, 10);

  // Growth potential: blend of platform+content synergy and event decision quality
  const base = Math.round((platformScore + contentScore) / 2);
  const growthScore = clamp(base + eventDelta, 2, 10);

  return {audienceScore, platformScore, contentScore, growthScore};
}

function GrowthReport({mode, data, platformKeys, platformNames, pillarKeys, pillarNames, event, eventChoiceIdx, onRestart}){
  const eventDelta = event.options[eventChoiceIdx].delta;
  const {audienceScore, platformScore, contentScore, growthScore} = useMemo(
    ()=>computeScores({mode, data, platformKeys, pillarKeys, eventDelta}),
    [mode, data, platformKeys, pillarKeys, eventDelta]
  );

  const scoresList = [
    {label:'Audience Understanding', value:audienceScore, color:'var(--teal)'},
    {label:'Platform Strategy', value:platformScore, color:'var(--violet)'},
    {label:'Content Strategy', value:contentScore, color:'var(--gold)'},
    {label:'Growth Potential', value:growthScore, color:'var(--coral)'},
  ];
  const best = scoresList.slice().sort((a,b)=>b.value-a.value)[0];
  const worst = scoresList.slice().sort((a,b)=>a.value-b.value)[0];

  const bestDecisionText = (() => {
    if(best.label==='Platform Strategy') return `Choosing ${platformNames.join(', ')} was well-matched to this specific audience — you resisted the urge to be everywhere.`;
    if(best.label==='Content Strategy') return `Your three pillars (${pillarNames.join(', ')}) cover distinct goals instead of overlapping — that variety is what keeps a feed from feeling repetitive.`;
    if(best.label==='Audience Understanding') return `You defined the audience and brand with real specificity — that clarity is quietly the most important decision in this whole case.`;
    return `Your response to the unexpected event ("${event.options[eventChoiceIdx].title}") protected long-term trust over a short-term reaction.`;
  })();

  const biggestMistakeText = (() => {
    if(worst.label==='Platform Strategy') return platformKeys.length>4
      ? `Spreading across ${platformKeys.length} platforms likely dilutes your effort — focus tends to outperform breadth, especially early on.`
      : `At least one chosen platform is a weaker fit for this specific audience than the alternatives — worth revisiting why it was picked.`;
    if(worst.label==='Content Strategy') return `Your three pillars lean toward similar goals rather than covering the full journey (awareness → trust → action) — that overlap limits growth.`;
    if(worst.label==='Audience Understanding') return `Some of the brand/audience intake was left thin — every downstream decision inherits that vagueness.`;
    return `Your response to the unexpected event ("${event.options[eventChoiceIdx].title}") prioritized a short-term fix over long-term brand trust.`;
  })();

  const lessons = mode==='personal' ? [
    {t:'Authenticity beats polish.', d:'Audiences follow specific people with a real point of view, not a generic feed of "expert content." Your story is the part no one can copy.'},
    {t:'Consistency compounds.', d:'One viral post fades in days. A recognizable point of view, repeated across weeks, is what actually builds a durable personal brand.'},
    {t:'Niche clarity attracts the right people.', d:'A broad, vague niche gets ignored. A specific one gets remembered — and remembered is what gets shared.'},
  ] : [
    {t:'Focus beats presence.', d:'Being excellent on 2-3 well-matched platforms outperforms being mediocre on 8. Every additional channel is a real time and quality cost.'},
    {t:'Content pillars need to cover the whole journey.', d:'A strategy that only builds awareness, or only pushes conversion, eventually stalls. Good pillar mixes move people through stages, not just impressions.'},
    {t:'How you respond to surprises is part of the strategy.', d:'Plans are made in calm rooms; brands are actually judged by how they behave when something unplanned happens.'},
  ];

  const finalPromptText = `Review my marketing strategy for ${data.name || '[name]'}: audience is ${data.audience || '[audience]'}, platforms are ${platformNames.join(', ') || '[platforms]'}, and content pillars are ${pillarNames.join(', ') || '[pillars]'}. Identify my single biggest strategic risk right now, and tell me the one thing I should fix first before doing anything else.`;

  return (
    <div className="stage">
      <div className="dossier-header">
        <div>
          <p className="exhibit">Exhibit 08 — Final Report</p>
          <h1>Growth Report: {data.name}</h1>
          <p className="tag">Here's how this case reads from a strategist's chair.</p>
        </div>
        <div className="stamp">CASE CLOSED</div>
      </div>

      <div className="report-grid">
        {scoresList.map(s=><ScoreCard key={s.label} {...s} />)}
      </div>

      <div className="verdict-row">
        <div className="verdict-card good">
          <span className="lbl">✓ Best Decision</span>
          <p>{bestDecisionText}</p>
        </div>
        <div className="verdict-card bad">
          <span className="lbl">⚠ Biggest Mistake</span>
          <p>{biggestMistakeText}</p>
        </div>
      </div>

      <div className="card">
        <h3>📚 Three Marketing Lessons</h3>
        {lessons.map((l,i)=>(
          <div className="lesson-item" key={i}>
            <div className="n">{i+1}</div>
            <p><strong>{l.t}</strong><br/>{l.d}</p>
          </div>
        ))}
      </div>

      <div className="card">
        <h3>📋 Case Summary</h3>
        <p><strong style={{color:'var(--text)'}}>Platforms:</strong> {platformNames.join(', ')}</p>
        <p><strong style={{color:'var(--text)'}}>Content Pillars:</strong> {pillarNames.join(', ')}</p>
        <p><strong style={{color:'var(--text)'}}>Event Response:</strong> {event.options[eventChoiceIdx].title}</p>
      </div>

      <PromptCard
        title="Get a strategist's second opinion"
        explanation="Use this any time you want Claude to pressure-test a real strategy the way this report just did."
        prompt={finalPromptText}
      />

      <div className="nav-row">
        <div></div>
        <button className="btn violet" onClick={onRestart}>🔁 Take on a New Case</button>
      </div>
    </div>
  );
}

/* ============ APP ============ */

const STEP_LABELS = [
  {key:'welcome', label:'Welcome'},
  {key:'mode', label:'Case Selection'},
  {key:'setup', label:'Brand Intake'},
  {key:'understand', label:'Understand'},
  {key:'platforms', label:'Platforms'},
  {key:'pillars', label:'Content Pillars'},
  {key:'roadmap', label:'30-Day Roadmap'},
  {key:'event', label:'Curveball'},
  {key:'report', label:'Growth Report'},
];

function emptyBusinessData(){
  return {name:'', industry:'', audience:'', budget:'Low ($0-1,500/month)', competitors:'', challenge:''};
}
function emptyPersonalData(){
  return {name:'', niche:'', audience:'', budget:'Low (2-3 hrs/week)', competitors:'', story:''};
}
function emptyRandomData(){
  return {name:'', emoji:'', industry:'', audience:'', budget:'', competitors:'', challenge:''};
}

function App(){
  const [stepIdx, setStepIdx] = useState(0);
  const [mode, setMode] = useState(null);

  const [businessData, setBusinessData] = useState(emptyBusinessData());
  const [personalData, setPersonalData] = useState(emptyPersonalData());
  const [randomData, setRandomData] = useState(emptyRandomData());

  const [platformKeys, setPlatformKeys] = useState([]);
  const [pillarKeys, setPillarKeys] = useState([]);
  const [event, setEvent] = useState(null);
  const [eventChoiceIdx, setEventChoiceIdx] = useState(null);

  const [log, setLog] = useState([]);
  const [ledgerOpen, setLedgerOpen] = useState(false);

  const addLog = (tag, text) => setLog(prev=>[...prev, {id:uid(), tag, text}]);

  const data = mode==='business' ? businessData : mode==='personal' ? personalData : randomData;
  const setData = mode==='business' ? setBusinessData : mode==='personal' ? setPersonalData : setRandomData;

  const platformNames = platformKeys.map(k=>PLATFORMS.find(p=>p.key===k)?.name).filter(Boolean);
  const pillarPool = mode==='personal' ? PERSONAL_PILLARS : BUSINESS_PILLARS;
  const pillarNames = pillarKeys.map(k=>pillarPool.find(p=>p.key===k)?.name).filter(Boolean);

  const goTo = (idx) => setStepIdx(idx);
  const next = () => setStepIdx(i=>Math.min(i+1, STEP_LABELS.length-1));

  const pickMode = (m) => {
    setMode(m);
    addLog('Case Selection', m==='business' ? 'Chose to use an existing business.' : m==='personal' ? 'Chose to build a personal brand.' : 'Chose to receive a new random client.');
    next();
  };

  const generateRandomClient = () => {
    const b = RANDOM_BUSINESSES[Math.floor(Math.random()*RANDOM_BUSINESSES.length)];
    setRandomData(b);
    return b;
  };

  const goPlatforms = () => {
    addLog('Understanding', 'Reviewed audience and brand positioning.');
    next();
  };
  const goPillars = () => {
    addLog('Platform Strategy', `Selected: ${platformNames.join(', ')}.`);
    next();
  };
  const goRoadmap = () => {
    addLog('Content Pillars', `Locked in: ${pillarNames.join(', ')}.`);
    next();
  };
  const goEvent = () => {
    addLog('Roadmap', 'Built a 4-week strategic roadmap.');
    const pool = mode==='personal' ? PERSONAL_EVENTS : BUSINESS_EVENTS;
    const e = pool[Math.floor(Math.random()*pool.length)];
    setEvent(e);
    setEventChoiceIdx(null);
    next();
  };
  const goReport = () => {
    addLog('Curveball', `Responded: "${event.options[eventChoiceIdx].title}"`);
    next();
  };

  const restart = () => {
    setStepIdx(1);
    setMode(null);
    setBusinessData(emptyBusinessData());
    setPersonalData(emptyPersonalData());
    setRandomData(emptyRandomData());
    setPlatformKeys([]);
    setPillarKeys([]);
    setEvent(null);
    setEventChoiceIdx(null);
    setLog([]);
  };

  const progressPct = Math.round((stepIdx/(STEP_LABELS.length-1))*100);

  let content = null;
  switch(STEP_LABELS[stepIdx].key){
    case 'welcome':
      content = <Welcome onStart={next} />; break;
    case 'mode':
      content = <ModeSelect onPick={pickMode} />; break;
    case 'setup':
      if(mode==='business') content = <SetupBusiness data={businessData} setData={setBusinessData} onNext={next} addLog={addLog} />;
      else if(mode==='personal') content = <SetupPersonal data={personalData} setData={setPersonalData} onNext={next} addLog={addLog} />;
      else content = <SetupRandom data={randomData} onGenerate={generateRandomClient} onNext={next} addLog={addLog} />;
      break;
    case 'understand':
      content = <Understand mode={mode} data={data} onNext={goPlatforms} />; break;
    case 'platforms':
      content = <Platforms mode={mode} data={data} chosen={platformKeys} setChosen={setPlatformKeys} onNext={goPillars} />; break;
    case 'pillars':
      content = <Pillars mode={mode} data={data} chosen={pillarKeys} setChosen={setPillarKeys} onNext={goRoadmap} />; break;
    case 'roadmap':
      content = <Roadmap mode={mode} data={data} platformNames={platformNames} pillarNames={pillarNames} onNext={goEvent} />; break;
    case 'event':
      content = event && <EventStep mode={mode} data={data} event={event} chosenIdx={eventChoiceIdx} setChosenIdx={setEventChoiceIdx} onNext={goReport} />; break;
    case 'report':
      content = event && <GrowthReport mode={mode} data={data} platformKeys={platformKeys} platformNames={platformNames} pillarKeys={pillarKeys} pillarNames={pillarNames} event={event} eventChoiceIdx={eventChoiceIdx} onRestart={restart} />; break;
    default: content = null;
  }

  return (
    <div className="app-shell">
      <div className="top-header">
        <div className="brand-mark">
          <div className="dot"></div>
          <div className="word">Strategy Desk</div>
          <div className="sub">CASE FILE / MARKETING</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div className="top-progress">
            <span>{progressPct}%</span>
            <div className="bar"><div className="fill" style={{width:progressPct+'%'}}></div></div>
          </div>
          <button className="mobile-ledger-toggle" onClick={()=>setLedgerOpen(true)}>📁 Case Log</button>
        </div>
      </div>

      <div className="rail rail-desktop">
        <div className="rail-title">Case Progress</div>
        {STEP_LABELS.map((s,i)=>(
          <div key={s.key} className={"rail-item" + (i===stepIdx?" active":"") + (i<stepIdx?" done":"")}>
            <span className="num">{String(i).padStart(2,'0')}</span>
            <span className="label">{s.label}</span>
          </div>
        ))}
      </div>

      <main>{content}</main>

      <div className="ledger ledger-desktop">
        <div className="hdr">
          <span className="t">Case Log</span>
          <span className="maturity">{log.length} entries</span>
        </div>
        <LedgerList entries={log} />
      </div>

      {ledgerOpen && (
        <div className="ledger-mobile-drawer" onClick={()=>setLedgerOpen(false)}>
          <div className="panel" onClick={e=>e.stopPropagation()}>
            <div className="hdr">
              <span className="t">Case Log</span>
              <button className="btn small ghost" onClick={()=>setLedgerOpen(false)}>✕</button>
            </div>
            <LedgerList entries={log} />
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
