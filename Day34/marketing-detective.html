<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective</title>
<style>
  :root{
    --void:#120d0a;
    --bg-deep:#1c140f;
    --bg-panel:#241a13;
    --cork:#4a3221;
    --cork-dark:#3a2718;
    --cork-light:#5c4128;
    --accent:#d97757;
    --accent-bright:#ff9662;
    --accent-dim:#a85c3f;
    --glow:rgba(217,119,87,0.55);
    --paper:#ece2cd;
    --paper-dark:#d8c9a8;
    --paper-shadow:#b7a680;
    --ink:#2c2015;
    --ink-soft:#4a3b28;
    --sticky-yellow:#f0d264;
    --sticky-yellow-dark:#d1af3f;
    --sticky-blue:#8bc0d6;
    --sticky-blue-dark:#5f97ae;
    --sticky-pink:#e39aa8;
    --sticky-pink-dark:#c26f80;
    --text-light:#f3e9db;
    --text-muted:#b8a68c;
    --text-faint:#8a7862;
    --red-stamp:#a8321f;
    --success:#7fae6a;
    --font-head:'Georgia','Times New Roman',serif;
    --font-body:'Courier New',Courier,monospace;
    --font-clean:'Trebuchet MS',Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(217,119,87,0.06), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(217,119,87,0.05), transparent 55%),
      var(--void);
    color:var(--text-light);
    font-family:var(--font-clean);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #root{min-height:100vh;position:relative;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--void);}
  ::-webkit-scrollbar-thumb{background:var(--cork-light);border-radius:6px;}

  /* ---------- Layout shells ---------- */
  .app-shell{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 28px;
    background:linear-gradient(180deg, rgba(28,20,15,0.95), rgba(28,20,15,0.75));
    border-bottom:1px solid rgba(217,119,87,0.18);
    position:sticky;
    top:0;
    z-index:60;
    backdrop-filter:blur(6px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-head);
    letter-spacing:1px;
  }
  .brand-badge{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent-bright), var(--accent-dim) 70%);
    box-shadow:0 0 14px var(--glow);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#1c140f;font-weight:bold;
  }
  .brand-title{font-size:18px;color:var(--text-light);font-weight:bold;}
  .brand-sub{font-size:10px;color:var(--text-faint);letter-spacing:3px;text-transform:uppercase;margin-top:1px;}

  .case-tag{
    font-family:var(--font-body);
    font-size:12px;
    color:var(--accent-bright);
    border:1px solid rgba(217,119,87,0.4);
    padding:5px 12px;
    border-radius:20px;
    background:rgba(217,119,87,0.08);
  }

  .main-area{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
    position:relative;
  }

  /* ---------- Progress dots ---------- */
  .progress-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin:6px 0 30px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .progress-dot{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:var(--font-body);
    font-size:11px;
    color:var(--text-faint);
  }
  .dot-circle{
    width:22px;height:22px;border-radius:50%;
    border:2px solid var(--cork-light);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    color:var(--text-faint);
    background:var(--bg-panel);
    transition:all .35s ease;
  }
  .progress-dot.active .dot-circle{
    border-color:var(--accent-bright);
    background:var(--accent);
    color:#1c140f;
    box-shadow:0 0 10px var(--glow);
  }
  .progress-dot.done .dot-circle{
    border-color:var(--success);
    background:var(--success);
    color:#12280f;
  }
  .progress-dot.active .dot-label{color:var(--accent-bright);}
  .progress-line{
    width:18px;height:2px;background:var(--cork-light);
  }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--font-clean);
    font-weight:700;
    font-size:14px;
    letter-spacing:0.5px;
    padding:13px 28px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    background:linear-gradient(180deg, var(--accent-bright), var(--accent-dim));
    color:#211208;
    box-shadow:0 6px 18px rgba(217,119,87,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    transition:transform .18s ease, box-shadow .18s ease, opacity .2s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 10px 24px rgba(217,119,87,0.5), inset 0 1px 0 rgba(255,255,255,0.3);}
  .btn:active:not(:disabled){transform:translateY(0px) scale(0.98);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none;}
  .btn.ghost{
    background:transparent;
    color:var(--accent-bright);
    border:1.5px solid var(--accent-dim);
    box-shadow:none;
  }
  .btn.ghost:hover:not(:disabled){background:rgba(217,119,87,0.1);}

  /* ---------- Title Screen ---------- */
  .title-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height:78vh;
    max-width:640px;
    margin:0 auto;
    animation:fadeUp .7s ease both;
  }
  .title-lamp{
    width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,150,98,0.35), transparent 70%);
    position:absolute;
    top:60px;
    filter:blur(6px);
    animation:flicker 4s ease-in-out infinite;
    pointer-events:none;
  }
  .magnifier{
    font-size:56px;
    margin-bottom:6px;
    filter:drop-shadow(0 0 12px var(--glow));
    animation:sway 3.5s ease-in-out infinite;
  }
  .title-main{
    font-family:var(--font-head);
    font-size:52px;
    color:var(--text-light);
    margin:6px 0 2px;
    letter-spacing:1px;
    text-shadow:0 0 24px rgba(217,119,87,0.35);
  }
  .title-main span{color:var(--accent-bright);}
  .title-tagline{
    font-family:var(--font-body);
    color:var(--text-muted);
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:30px;
  }
  .title-desc{
    color:var(--text-muted);
    font-size:15px;
    line-height:1.6;
    max-width:480px;
    margin-bottom:34px;
  }
  .file-count-badge{
    font-family:var(--font-body);
    font-size:12px;
    color:var(--text-faint);
    margin-top:18px;
  }

  /* ---------- Folder / Case assignment screen ---------- */
  .assignment-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:620px;
    width:100%;
    text-align:center;
    animation:fadeUp .6s ease both;
  }
  .kicker{
    font-family:var(--font-body);
    color:var(--accent-bright);
    letter-spacing:3px;
    font-size:12px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .manila-folder{
    position:relative;
    width:100%;
    max-width:480px;
    background:linear-gradient(160deg, var(--paper) 0%, var(--paper-dark) 100%);
    border-radius:6px 6px 10px 10px;
    box-shadow:0 20px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.15);
    color:var(--ink);
    padding:34px 28px 26px;
    margin:18px 0 26px;
    transform:rotate(-1deg);
    animation:folderOpen .7s ease .1s both;
  }
  .manila-folder::before{
    content:'';
    position:absolute;
    top:-16px;left:26px;
    width:120px;height:20px;
    background:var(--paper-dark);
    border-radius:6px 6px 0 0;
  }
  .stamp-classified{
    position:absolute;
    top:10px;right:16px;
    border:2px solid var(--red-stamp);
    color:var(--red-stamp);
    font-family:var(--font-head);
    font-weight:bold;
    font-size:11px;
    padding:3px 8px;
    border-radius:4px;
    transform:rotate(8deg);
    opacity:0.75;
    letter-spacing:1px;
  }
  .folder-company{
    font-family:var(--font-head);
    font-size:28px;
    color:var(--ink);
    margin-bottom:2px;
  }
  .folder-industry{
    font-family:var(--font-body);
    color:var(--ink-soft);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:18px;
  }
  .folder-divider{
    height:1px;
    background:repeating-linear-gradient(90deg, var(--paper-shadow) 0 6px, transparent 6px 12px);
    margin:14px 0;
  }
  .folder-field{text-align:left;margin-bottom:12px;}
  .folder-field-label{
    font-family:var(--font-body);
    font-size:10.5px;
    color:var(--accent-dim);
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:3px;
    font-weight:bold;
  }
  .folder-field-value{
    font-family:var(--font-clean);
    font-size:14.5px;
    color:var(--ink);
    line-height:1.4;
  }
  .briefing-text{
    font-size:14px;
    color:var(--text-muted);
    line-height:1.7;
    max-width:480px;
    margin-bottom:26px;
  }

  /* ---------- Investigation board ---------- */
  .board-layout{
    display:flex;
    gap:26px;
    width:100%;
    max-width:1080px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
  }
  .corkboard{
    flex:2 1 560px;
    min-width:300px;
    background:
      radial-gradient(circle at 15% 20%, rgba(0,0,0,0.12) 0, transparent 3%),
      radial-gradient(circle at 65% 55%, rgba(0,0,0,0.1) 0, transparent 2.5%),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.12) 0, transparent 3%),
      radial-gradient(circle at 85% 15%, rgba(0,0,0,0.1) 0, transparent 2.5%),
      repeating-linear-gradient(45deg, var(--cork) 0 2px, var(--cork-dark) 2px 4px);
    border-radius:14px;
    border:10px solid #2a1b10;
    box-shadow:0 22px 50px rgba(0,0,0,0.55), inset 0 0 60px rgba(0,0,0,0.35);
    padding:26px 20px;
    position:relative;
  }
  .corkboard-title{
    font-family:var(--font-head);
    color:var(--paper);
    text-align:center;
    font-size:20px;
    margin-bottom:4px;
    text-shadow:0 2px 4px rgba(0,0,0,0.5);
  }
  .corkboard-hint{
    text-align:center;
    font-family:var(--font-body);
    font-size:11.5px;
    color:rgba(243,233,219,0.65);
    margin-bottom:20px;
    letter-spacing:0.5px;
  }
  .evidence-grid{
    display:flex;
    flex-wrap:wrap;
    gap:26px 22px;
    justify-content:center;
    padding:10px 4px 20px;
  }

  .evidence-folder{
    width:158px;
    min-height:118px;
    background:linear-gradient(160deg, var(--paper), var(--paper-dark));
    border-radius:4px 4px 8px 8px;
    box-shadow:0 12px 22px rgba(0,0,0,0.45);
    padding:16px 12px 12px;
    cursor:grab;
    position:relative;
    user-select:none;
    touch-action:none;
    transition:box-shadow .2s ease;
  }
  .evidence-folder:nth-child(1){transform:rotate(-4deg);}
  .evidence-folder:nth-child(2){transform:rotate(3deg);}
  .evidence-folder:nth-child(3){transform:rotate(-2deg);}
  .evidence-folder:nth-child(4){transform:rotate(4deg);}
  .evidence-folder:active{cursor:grabbing;}
  .evidence-folder:hover{box-shadow:0 16px 30px rgba(0,0,0,0.55), 0 0 0 2px var(--accent-dim);}
  .evidence-folder.examined{box-shadow:0 12px 22px rgba(0,0,0,0.45), 0 0 0 2px var(--success);}
  .pin{
    position:absolute;
    top:-9px;left:50%;
    transform:translateX(-50%);
    width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff8a6a, #a8321f 75%);
    box-shadow:0 3px 5px rgba(0,0,0,0.5);
    z-index:2;
  }
  .folder-tab{font-size:26px;margin-bottom:8px;}
  .folder-label{
    font-family:var(--font-body);
    font-weight:bold;
    font-size:12px;
    color:var(--ink);
    text-transform:uppercase;
    letter-spacing:0.5px;
    line-height:1.3;
  }
  .folder-check{
    position:absolute;
    bottom:8px;right:10px;
    color:var(--success);
    font-weight:bold;
    font-size:15px;
  }

  .notebook-panel{
    flex:1 1 260px;
    min-width:250px;
    background:linear-gradient(160deg, #241a13, #1b130d);
    border:1px solid rgba(217,119,87,0.25);
    border-radius:12px;
    padding:20px;
    box-shadow:0 18px 40px rgba(0,0,0,0.5);
    max-height:640px;
    overflow-y:auto;
  }
  .notebook-title{
    font-family:var(--font-head);
    color:var(--accent-bright);
    font-size:18px;
    margin-bottom:4px;
  }
  .notebook-sub{
    font-family:var(--font-body);
    font-size:11px;
    color:var(--text-faint);
    margin-bottom:16px;
  }
  .clue-item{
    background:var(--sticky-yellow);
    color:#3a2c0d;
    border-radius:2px;
    padding:12px 14px;
    margin-bottom:14px;
    font-family:var(--font-clean);
    font-size:13.5px;
    line-height:1.45;
    box-shadow:0 8px 16px rgba(0,0,0,0.35);
    transform:rotate(-1.4deg);
    animation:popIn .5s ease both;
    position:relative;
  }
  .clue-item:nth-child(even){transform:rotate(1.4deg); background:var(--sticky-blue); color:#12303c;}
  .clue-item .clue-num{
    font-weight:bold;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    display:block;
    margin-bottom:4px;
    opacity:0.65;
  }
  .clue-locked{
    background:rgba(255,255,255,0.03);
    border:1.5px dashed rgba(243,233,219,0.18);
    border-radius:6px;
    padding:14px;
    margin-bottom:14px;
    text-align:center;
    color:var(--text-faint);
    font-family:var(--font-body);
    font-size:12px;
  }
  .locked-icon{font-size:20px;display:block;margin-bottom:6px;opacity:0.5;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(8,5,3,0.78);
    backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    z-index:200;
    padding:20px;
    animation:fadeIn .25s ease both;
  }
  .modal-card{
    background:linear-gradient(165deg, #251a12, #1a120c);
    border:1px solid rgba(217,119,87,0.3);
    border-radius:16px;
    max-width:560px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
    padding:28px 26px;
    box-shadow:0 30px 70px rgba(0,0,0,0.7), 0 0 40px rgba(217,119,87,0.12);
    animation:popIn .35s ease both;
    position:relative;
  }
  .modal-close{
    position:absolute;top:16px;right:18px;
    background:none;border:none;color:var(--text-faint);
    font-size:20px;cursor:pointer;
    transition:color .2s;
  }
  .modal-close:hover{color:var(--accent-bright);}
  .modal-title{
    font-family:var(--font-head);
    font-size:22px;
    color:var(--accent-bright);
    margin-bottom:4px;
    display:flex;align-items:center;gap:10px;
  }
  .modal-sub{
    font-family:var(--font-body);
    font-size:11.5px;
    color:var(--text-faint);
    margin-bottom:20px;
    text-transform:uppercase;
    letter-spacing:1px;
  }

  .metric-row{display:flex;flex-direction:column;gap:14px;margin-top:6px;}
  .metric-item-label{
    display:flex;justify-content:space-between;
    font-family:var(--font-body);
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:5px;
  }
  .metric-value{color:var(--accent-bright);font-weight:bold;}
  .metric-bar-track{
    height:9px;border-radius:6px;background:rgba(255,255,255,0.07);overflow:hidden;
  }
  .metric-bar-fill{
    height:100%;border-radius:6px;
    background:linear-gradient(90deg, var(--accent-dim), var(--accent-bright));
    width:0%;
    transition:width 1.1s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 10px var(--glow);
  }

  .channel-row{margin-bottom:12px;}
  .channel-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--text-light);}
  .channel-pct{color:var(--accent-bright);font-weight:bold;font-family:var(--font-body);}

  .comment-note{
    background:var(--sticky-pink);
    color:#3a1420;
    padding:12px 14px;
    border-radius:2px;
    font-size:13.5px;
    line-height:1.45;
    margin-bottom:12px;
    box-shadow:0 8px 14px rgba(0,0,0,0.3);
    font-style:italic;
    transform:rotate(-1deg);
  }
  .comment-note:nth-child(even){transform:rotate(1deg); background:var(--sticky-yellow); color:#3a2c0d;}

  .social-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.04);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    border:1px solid rgba(255,255,255,0.06);
  }
  .social-platform{font-weight:bold;font-size:13.5px;color:var(--text-light);}
  .social-stat{font-family:var(--font-body);font-size:12px;color:var(--text-muted);margin-top:2px;}
  .sentiment-tag{
    font-size:10.5px;
    padding:4px 10px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-weight:bold;
    white-space:nowrap;
  }
  .sentiment-negative{background:rgba(200,80,60,0.2);color:#f0917a;}
  .sentiment-mixed{background:rgba(217,180,80,0.2);color:#e8cd7a;}
  .sentiment-positive{background:rgba(120,180,100,0.2);color:#a4d68c;}

  .modal-cta{margin-top:22px;display:flex;justify-content:flex-end;}

  /* ---------- Solve screen ---------- */
  .solve-wrap{max-width:680px;width:100%;text-align:center;animation:fadeUp .6s ease both;}
  .solve-question{
    font-family:var(--font-head);
    font-size:24px;
    color:var(--text-light);
    margin-bottom:8px;
  }
  .solve-sub{
    font-family:var(--font-body);
    font-size:12.5px;
    color:var(--text-faint);
    margin-bottom:28px;
  }
  .options-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:30px;
  }
  @media (max-width:600px){ .options-grid{grid-template-columns:1fr;} }
  .option-card{
    background:linear-gradient(160deg, var(--bg-panel), var(--bg-deep));
    border:1.5px solid rgba(217,119,87,0.2);
    border-radius:12px;
    padding:18px 16px;
    font-size:14px;
    color:var(--text-light);
    cursor:pointer;
    text-align:left;
    line-height:1.4;
    transition:all .2s ease;
    position:relative;
  }
  .option-card:hover{border-color:var(--accent-bright); transform:translateY(-3px); box-shadow:0 10px 20px rgba(0,0,0,0.4);}
  .option-card.selected{border-color:var(--accent-bright); background:rgba(217,119,87,0.14); box-shadow:0 0 0 2px var(--accent-bright);}
  .option-letter{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;
    background:rgba(217,119,87,0.15);
    color:var(--accent-bright);
    font-size:11px;font-weight:bold;
    margin-right:8px;
  }

  /* ---------- Closed screen ---------- */
  .closed-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:66vh;text-align:center;position:relative;
  }
  .stamp-big{
    font-family:var(--font-head);
    font-weight:bold;
    font-size:56px;
    color:var(--red-stamp);
    border:6px solid var(--red-stamp);
    border-radius:10px;
    padding:10px 34px;
    letter-spacing:3px;
    transform:rotate(-9deg) scale(0);
    animation:stampDown .5s cubic-bezier(.2,1.4,.6,1) .2s forwards;
    opacity:0.9;
    margin-bottom:26px;
  }
  .closed-folder{
    font-size:64px;
    margin-bottom:10px;
    animation:fadeUp .6s ease .1s both;
  }
  .verdict-text{
    font-family:var(--font-clean);

/* Utility: shuffle array (Fisher-Yates) */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================
   Reusable drag hook
========================================================= */
function useDrag() {
  const [pos, setPos] = useState({ x: 0, y: 0 });
  const dragging = useRef(false);
  const start = useRef({ mouseX: 0, mouseY: 0, posX: 0, posY: 0 });
  const wasDragged = useRef(false);

  const onDown = (e) => {
    dragging.current = true;
    wasDragged.current = false;
    const point = e.touches ? e.touches[0] : e;
    const mx = point.clientX, my = point.clientY;
    setPos(prev => {
      start.current = { mouseX: mx, mouseY: my, posX: prev.x, posY: prev.y };
      return prev;
    });
  };

  useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current) return;
      if (e.cancelable) e.preventDefault();
      const point = e.touches ? e.touches[0] : e;
      const dx = point.clientX - start.current.mouseX;
      const dy = point.clientY - start.current.mouseY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) wasDragged.current = true;
      setPos({ x: start.current.posX + dx, y: start.current.posY + dy });
    };
    const onUp = () => { dragging.current = false; };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onUp);
    };
  }, []);

  return { x: pos.x, y: pos.y, onDown, wasDragged };
}

========================================================= */
function AnimatedBar({ pct, delay }) {
  const [w, setW] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setW(pct), 120 + (delay || 0));
    return () => clearTimeout(t);
  }, [pct, delay]);
  return (
    <div className="metric-bar-track">
      <div className="metric-bar-fill" style={{ width: w + '%' }}></div>
    </div>
  );
}

function ProgressDots({ step }) {
  const steps = ["Assignment", "Board", "Investigate", "Solve", "Closed", "Report"];
  return (
    <div className="progress-row">
      {steps.map((label, i) => {
        const idx = i + 1;
        const cls = idx < step ? "done" : (idx === step ? "active" : "");
        return (
          <React.Fragment key={label}>
            <div className={"progress-dot " + cls}>
              <div className="dot-circle">{idx < step ? "✓" : idx}</div>
              <span className="dot-label">{label}</span>
            </div>
            {i < steps.length - 1 && <div className="progress-line"></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function Toast({ message, toastKey }) {
  if (!message) return null;

function EvidenceFolder({ label, icon, examined, onExamine }) {
  const drag = useDrag();

    if (drag.wasDragged.current) { drag.wasDragged.current = false; return; }
    onExamine();
  };
  return (
    <div
      className={"evidence-folder" + (examined ? " examined" : "")}
      style={{ transform: `translate(${drag.x}px, ${drag.y}px)` }}
      onMouseDown={drag.onDown}
      onTouchStart={drag.onDown}
      onClick={handleClick}
    >
      <div className="pin"></div>
      <div className="folder-tab">{icon}</div>
      <div className="folder-label">{label}</div>
      {examined && <div className="folder-check">✓</div>}
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("title");
  const [caseData, setCaseData] = useState(null);
  const [examined, setExamined] = useState({});
  const [revealedClues, setRevealedClues] = useState([]);
  const [modalKey, setModalKey] = useState(null);
  const [isCorrect, setIsCorrect] = useState(false);
  const [toast, setToast] = useState(null);
  const [toastKey, setToastKey] = useState(0);
  const lastCaseId = useRef(null);

  const pickNewCase = () => {
    let pool = CASES;
    if (lastCaseId.current !== null && CASES.length > 1) {
      pool = CASES.filter(c => c.id !== lastCaseId.current);
    }
    const next = pool[Math.floor(Math.random() * pool.length)];
    lastCaseId.current = next.id;
    setCaseData(next);
    setExamined({});
    setRevealedClues([]);
    setModalKey(null);
    setIsCorrect(false);
    setScreen("assignment");
  };

  const showToast = (msg) => {
    setToast(msg);
    setToastKey(k => k + 1);
  };

  const handleExamine = (key) => {
    setModalKey(key);
    setExamined(prev => {
      if (prev[key]) return prev;
      const updated = { ...prev, [key]: true };
      return updated;
    });
  };

  const handleCloseModal = () => {
    setModalKey(null);
    // reveal a clue if we haven't revealed all 3 yet, tied to examined count
    setExamined(currentExamined => {
      const examinedCount = Object.values(currentExamined).filter(Boolean).length;
      setRevealedClues(prevClues => {
        if (prevClues.length < 3 && prevClues.length < examinedCount) {
          const clueIndex = prevClues.length;
          showToast("🔎 New clue uncovered!");
          return [...prevClues, caseData.clues[clueIndex]];
        }
        return prevClues;
      });
      return currentExamined;
    });
  };

  const handleSolveSubmit = (correct) => {
    setIsCorrect(correct);
    setScreen("closed");
  };

  let progressStep = 1;
  if (screen === "board") progressStep = 3;
  if (screen === "solve") progressStep = 4;
  if (screen === "closed") progressStep = 5;
  if (screen === "report") progressStep = 6;

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand">
          <div className="brand-badge">MD</div>
          <div>
            <div className="brand-title">Marketing Detective</div>
            <div className="brand-sub">Case Files Agency</div>
          </div>
        </div>
        {caseData && screen !== "title" && (
          <div className="case-tag">Case #{caseData.id} · {caseData.company}</div>
        )}
      </div>

      <div className="main-area">
        {screen === "title" && <TitleScreen onStart={pickNewCase} />}

        {screen === "assignment" && caseData && (
          <AssignmentScreen caseData={caseData} onProceed={() => setScreen("board")} />
        )}

        {screen === "board" && caseData && (
          <BoardScreen
            caseData={caseData}
            examined={examined}
            onExamine={handleExamine}
            revealedClues={revealedClues}
            onReadyToSolve={() => setScreen("solve")}
          />
        )}

        {screen === "solve" && caseData && (
          <SolveScreen caseData={caseData} onSubmit={handleSolveSubmit} />
        )}

        {screen === "closed" && (
          <ClosedScreen isCorrect={isCorrect} onContinue={() => setScreen("report")} />
        )}

        {screen === "report" && caseData && (
          <ReportScreen caseData={caseData} isCorrect={isCorrect} onNewCase={pickNewCase} />
        )}
      </div>

      {modalKey && (
        <EvidenceModal evidenceKey={modalKey} caseData={caseData} onClose={handleCloseModal} />
      )}

      <Toast message={toast} toastKey={toastKey} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
